gaps:
- >-
  api_token is not modelled as an OpenAPI securityScheme in nine of the ten specs, so
  securitySchemes-defined and securitySchemes-applied contract checks fail even though every
  operation is in fact authenticated.
- >-
  No /.well-known/oauth-protected-resource (RFC 9728) on the MCP host, so an MCP client cannot
  discover the authorization server from the resource.
