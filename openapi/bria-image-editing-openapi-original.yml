  /gen_fill:
    post:
      summary: Generative Fill
      tags:
        - v2 endpoints
      servers:
        - url: https://engine.prod.bria-api.com/v2/image/edit
      description: >-
        [**Try out this capability in Bria's
        sandbox**](https://platform.bria.ai/image-editing/generative-fill)


        **Description**


        The *GenFill Route* enables the generation of objects by prompt in a
        specific region of an image.


        You can define the area for object generation by using a mask that
        outlines the region where the object will be created. Our model is
        optimized to work seamlessly with blob-shaped masks.


        Masks can be created by allowing users to draw directly on the image
        with a brush, for example. To access the SDK that demonstrates how to
        implement a brush feature in your interface, please refer to the
        following <a
        href="https://github.com/Bria-AI/js-api-sdk/blob/main/manual_brush_ui"
        target="_blank">link</a>.


        **Output Characteristics**


        - The modified image is returned at the original resolution, preserving
        full visual quality without any automatic resizing or downscaling.

        - All areas outside the provided mask remain completely unchanged,
        ensuring pixel-perfect preservation of unedited regions.

        - If the input includes an alpha channel and `preserve_alpha=true`, the
        original transparency values (both full and partial) are maintained in
        the output.


        **Content Moderation**


        This endpoint includes granular content moderation controls to ensure
        safe usage across all stages of processing:
          
        - **Prompt Moderation** – Validates the provided prompt and rejects
        requests containing unsafe or prohibited terms before processing starts.

        - **Input Image Moderation** – Scans the uploaded image and stops
        processing if inappropriate or restricted content is detected.

        - **Output Image Moderation** – Evaluates the generated image and blocks
        the response if it violates safety guidelines.
      operationId: gen-fill
      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
          description: API token associated with the organization.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - image
                - mask
                - prompt
              properties:
                image:
                  type: string
                  description: >
                    The source image to be handled by the API.  

                    Supported input types:  

                    - **Base64-encoded string**

                    - **URL** pointing to an image file that is publicly
                    accessible and available at the time of processing.  


                    Accepted formats: **JPEG**, **JPG**, **PNG**, **WEBP**.
                mask:
                  type: string
                  description: >
                    The binary mask image that defines the region where object
                    generation will occur.


                    **Mask Requirements**

                    - The region to generate content must have a pixel value of
                    **255 (white)**.

                    - All other areas must have a pixel value of **0 (black)**.

                    - The mask must have the **same aspect ratio** as the input
                    image.


                    **Supported Input Types**

                    - **Base64-encoded string** – provide the mask data directly
                    in the request.

                    - **URL** – provide a publicly accessible URL to the mask
                    image.


                    Accepted formats: **JPEG**, **JPG**, **PNG**, **WEBP**.


                    Ensure that any provided URL is publicly accessible at the
                    time of the request.
                prompt:
                  type: string
                  description: >
                    The prompt you would like to use to generate the object
                    within the masked region.


                    Prompt Length Limits: ~90-110 words
                refine_prompt:
                  type: boolean
                  default: true
                  description: >
                    Controls the automatic prompt refinement feature.

                    - **`true` (default):** The provided prompt is automatically
                    adjusted for optimal results. The adjusted prompt is then
                    returned in the response payload as `refined_prompt`.

                    - **`false`:** The original prompt is used as-is, without
                    modification.
                prompt_content_moderation:
                  type: boolean
                  default: true
                  description: >
                    When enabled (default: `true`), the input prompt is
                    moderated before processing.


                    **Expected Behavior**

                    - The prompt is scanned for NSFW content and terms that
                    violate Bria’s ethical guidelines.  

                    - If the prompt fails moderation, the request is blocked and
                    the API responds with a 422 error.
                negative_prompt:
                  type: string
                  description: >-
                    The prompt you would like to use to specify details or
                    attributes to avoid in the object generated within the
                    masked region.
                preserve_alpha:
                  type: boolean
                  default: true
                  description: >
                    Controls whether the alpha channel values from the input
                    image are retained in the output, if the input includes an
                    alpha channel.

                    - When true: The output image maintains the original
                    transparency of fully and partially transparent pixels.

                    - When false: The output image is fully opaque.

                    - Has no effect if the input image does not include an alpha
                    channel.
                sync:
                  type: boolean
                  default: false
                  description: |
                    Specifies the response mode.
                      - When `false` (default), the request is processed asynchronously: the API immediately returns a status URL to track progress.
                      - When `true`, the request is processed synchronously: the API hold the connection open until the proccess is complete and then returns the final image URL in the response.
                webhook_url:
                  type: string
                  format: uri
                  description: >-
                    Optional URL for receiving the result via webhook when the
                    async job completes. See
                    [Webhooks](https://docs.bria.ai/webhooks).
                seed:
                  type: integer
                  description: >-
                    You can choose whether you want your generated results to be
                    random or predictable. You can recreate the same result in
                    the future by using the seed value of a result from a
                    response. You can exclude this parameter if you are not
                    interested in recreating your results. This parameter is
                    optional.
                visual_input_content_moderation:
                  type: boolean
                  default: false
                  description: >
                    When enabled, applies content moderation to input visual.


                    Expected behavior:

                    - Processing stops if the image fails moderation.

                    - Returns a 422 error with details about which parameter
                    failed.
                visual_output_content_moderation:
                  type: boolean
                  default: false
                  description: >
                    When enabled, applies content moderation to result visual.


                    Expected behavior:

                    - If the modified image fails moderation, returns a 422
                    error.
            examples:
              send using url:
                value:
                  image: >-
                    https://labs-assets.bria.ai/sandbox-example-inputs/genfill_image_example.jpg
                  mask: >-
                    https://labs-assets.bria.ai/sandbox-example-inputs/genfill_mask_exmple.jpg
                  prompt: A red delicious cherry
      responses:
        '200':
          description: Successful operation (Synchronous Success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSuccessResponse'
        '202':
          description: >-
            Accepted (Asynchronous). You can track the progress and retrieve the
            final result using the Status Service. For more details, refer to
            the [Status Service](https://docs.bria.ai/status) section.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncInitialResponse'
        '400':
          description: >-
            Bad request. This can be due to a malformed request, invalid JSON,
            or a missing required parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: >
            Not Found. The requested resource could not be found. This can be
            due to:

            - The image or mask URL could not be found.
               content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >
            Unprocessable Entity. This error is returned for validation
            failures, such as:

            - A parameter failing content moderation (e.g.,
            `prompt_content_moderation: true` and an unsafe prompt).

            - Image or mask requirements not being met (e.g., different aspect
            ratios).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Request limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '460':
          description: Failed to download image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        5XX:
          description: >
            **Internal Server Error** – A critical failure occurred in Bria's
            infrastructure, preventing the Status Service from responding.  

            - This response indicates a service outage or unexpected runtime
            failure.  

            - Check [Bria's Status Page](https://status.bria.ai) for real-time
            updates.

            - Contact [Support](mailto:support@bria.ai).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /remove_background:
    post:
      summary: Remove Background
      tags:
        - v2 endpoints
      servers:
        - url: https://engine.prod.bria-api.com/v2/image/edit
      description: >-
        [**Try out this capability in Bria's
        sandbox**](https://platform.bria.ai/image-editing/remove-background)


        **Description**



        The *Remove BG* Route can be used to remove the background of an image.
        This route leverages Bria's newest model, RMBG 2.0. For more details and
        to explore the model, check out the [Hugging Face
        demo](https://huggingface.co/spaces/briaai/BRIA-RMBG-2.0).



        **Content Moderation**


        This endpoint includes granular content moderation controls to ensure
        safe usage across all stages of processing:
          
        - **Input Image Moderation** – Scans the uploaded image and stops
        processing if inappropriate or restricted content is detected.

        - **Output Image Moderation** – Evaluates the generated image and blocks
        the response if it violates safety guidelines.



        **Constraints**



        The Bria API currently supports only JPEG and PNG files in RGB, RGBA, or
        CMYK color modes. When the file is of a different type or color mode,
        the status code 415 will be returned.



        **Transparency and Customizable Binarization**



        This endpoint returns an image where the background is removed, and the
        foreground remains with varying levels of transparency, allowing for
        smoother edges and more natural blending when placed over different
        backgrounds. Additionally, this unique output provides developers with
        the flexibility to binarize the result—transforming it into a binary
        mask—by setting a custom transparency threshold according to their
        specific use case. A binary mask is an image where pixels are either
        fully visible (foreground) or fully transparent (background), commonly
        used in visual generative AI and image processing pipelines. This
        capability enables seamless integration into workflows that require
        clear separation between subject and background, while still offering
        control over how strict this separation should be.



        Below is a simple Python script to demonstrate how you can binarize the
        output image from the API. This allows you to set your own threshold to
        determine which areas are considered "foreground" and which are
        "background."

          ```python
          from PIL import Image
          import numpy as np

          # Load the image (the output from the API)
          image = Image.open('output_image.png').convert('RGBA')

          # Convert to numpy array
          data = np.array(image)

          # Define your threshold (0-255, where 255 is fully opaque)
          threshold = 128

          # Apply the threshold: if alpha > threshold, set to fully opaque (255), otherwise transparent (0)
          data[:, :, 3] = np.where(data[:, :, 3] > threshold, 255, 0)

          # Create a new Image from the modified array
          binarized_image = Image.fromarray(data)

          # Save or display
          binarized_image.save('binarized_output.png')
          binarized_image.show()
            ```
      operationId: background-remove
      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  description: >
                    The image that you would like to remove the background from.

                    Supported input types:  

                    - **Base64-encoded string**  

                    - **URL** pointing to an image file that is publicly
                    accessible and available at the time of processing.  


                    Accepted formats: **JPEG**, **JPG**, **PNG**, **WEBP**.
                preserve_alpha:
                  type: boolean
                  default: true
                  description: >
                    Controls whether partially transparent areas from the input
                    image are retained in the output after background removal,
                    if the input includes an alpha channel.

                    - When true: Partially transparent pixels preserve their
                    original alpha values in the output.

                    - When false: All non-background areas in the output are
                    rendered fully opaque.

                    - Has no effect if the input image does not include an alpha
                    channel.
                sync:
                  type: boolean
                  default: false
                  description: |
                    Specifies the response mode.
                      - When `false` (default), the request is processed asynchronously: the API immediately returns a status URL to track progress.
                      - When `true`, the request is processed synchronously: the API hold the connection open until the proccess is complete and then returns the final image URL in the response.
                webhook_url:
                  type: string
                  format: uri
                  description: >-
                    Optional URL for receiving the result via webhook when the
                    async job completes. See
                    [Webhooks](https://docs.bria.ai/webhooks).
                visual_input_content_moderation:
                  type: boolean
                  default: false
                  description: >
                    When enabled, applies content moderation to input visual.


                    Expected behavior:

                    - Processing stops if the image fails moderation.

                    - Returns a 422 error with details about which parameter
                    failed.
                visual_output_content_moderation:
                  type: boolean
                  default: false
                  description: >
                    When enabled, applies content moderation to result visual.


                    Expected behavior:

                    - If the modified image fails moderation, returns a 422
                    error.
            examples:
              send using url:
                value:
                  image: >-
                    https://labs-assets.bria.ai/sandbox-example-inputs/remove_background_example.jpg
      responses:
        '200':
          description: Successful operation (Synchronous Success)
          content:
