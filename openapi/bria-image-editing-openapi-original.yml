    post:
      summary: Erase Foreground
      tags:
        - v2 endpoints
      servers:
        - url: https://engine.prod.bria-api.com/v2/image/edit
      description: >-
        [**Try out this capability in Bria's
        sandbox**](https://platform.bria.ai/image-editing/erase-foreground)




        **Description**




        The **Erase Foreground** endpoint removes the primary subject
        (foreground) from the input image and intelligently generates the
        background to fill the erased area.  


        **Output Characteristics**  

        - Returns the edited image at its original resolution, ensuring full
        visual fidelity without any automatic resizing or downscaling.  

        - Only the foreground is removed; all other areas remain unaltered,
        preserving pixel-perfect accuracy in untouched regions.  

