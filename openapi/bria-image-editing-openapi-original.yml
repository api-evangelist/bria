  /increase_resolution:
    post:
      summary: Increase Resolution
      tags:
        - v2 endpoints
      servers:
        - url: https://engine.prod.bria-api.com/v2/image/edit
      description: >-
        [**Try out this capability in Bria's
        sandbox**](https://platform.bria.ai/image-editing/increase-resolution)



        **Description**




        The *Increase Resolution Route* is used to upscale the resolution of any
        image.



        **Content Moderation**


        This endpoint includes granular content moderation controls to ensure
        safe usage across all stages of processing:


        - **Input Image Moderation** – Scans the uploaded image and stops
        processing if inappropriate or restricted content is detected.

        - **Output Image Moderation** – Evaluates the generated image and blocks
        the response if it violates safety guidelines.


        **Constraints**



        The Bria API currently supports only JPEG and PNG files in RGB, RGBA, or
        CMYK color modes. When the file is of a different type or color mode,
        the status code 415 will be returned. 



        It's possible to increase the resolution of an image up to a total area
        of 8192x8192 pixels.



        Unlike the [Enhance
        Image](https://docs.bria.ai/image-editing/endpoints/enhance-image)
        route, this endpoint does not add new details — it increases resolution
        using a dedicated upscaling method that preserves the original image
        content without regeneration.
      operationId: increase-resolution
      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  description: >
                    The source image to be handled by the API.  

                    Supported input types:  

                    - **Base64-encoded string**  

                    - **URL** pointing to an image file that is publicly
                    accessible and available at the time of processing.  


                    Accepted formats: **JPEG**, **JPG**, **PNG**, **WEBP**.
                preserve_alpha:
                  type: boolean
                  default: true
                  description: >
                    Controls whether the alpha channel values from the input
                    image are retained in the output, if the input includes an
                    alpha channel.

                    - When true: The output image maintains the original
                    transparency of fully and partially transparent pixels.

                    - When false: The output image is fully opaque.

                    - Has no effect if the input image does not include an alpha
                    channel.
                desired_increase:
                  type: integer
                  default: 2
                  description: >-
                    The resolution multiplier. The possible value are 2,4. It's
                    possible to increase the resolution of an image up to a
                    total area of 8,192x8,192 pixels.
                sync:
                  type: boolean
                  default: false
                  description: |
                    Specifies the response mode.
                      - When `false` (default), the request is processed asynchronously: the API immediately returns a status URL to track progress.
                      - When `true`, the request is processed synchronously: the API hold the connection open until the proccess is complete and then returns the final image URL in the response.
                webhook_url:
                  type: string
                  format: uri
                  description: >-
                    Optional URL for receiving the result via webhook when the
                    async job completes. See
                    [Webhooks](https://docs.bria.ai/webhooks).
                visual_input_content_moderation:
                  type: boolean
                  default: false
                  description: >
                    When enabled, applies content moderation to input visual.


                    Expected behavior:

                    - Processing stops if the image fails moderation.

                    - Returns a 422 error with details about which parameter
                    failed.
                visual_output_content_moderation:
                  type: boolean
                  default: false
                  description: >
                    When enabled, applies content moderation to result visual.


                    Expected behavior:

                    - If the modified image fails moderation, returns a 422
                    error.
            example:
              image: example
      responses:
        '200':
          description: Successful operation (Synchronous Success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSuccessResponse'
        '202':
          description: >-
            Accepted (Asynchronous). You can track the progress and retrieve the
            final result using the Status Service. For more details, refer to
            the [Status Service](https://docs.bria.ai/status) section.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncInitialResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found. Image could not be found at the provided URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Request limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '460':
          description: Failed to download image.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        5XX:
          description: >
            **Internal Server Error** – A critical failure occurred in Bria's
            infrastructure, preventing the Status Service from responding.  

            - This response indicates a service outage or unexpected runtime
            failure.  

            - Check [Bria's Status Page](https://status.bria.ai) for real-time
            updates.  

            - Contact [Support](mailto:support@bria.ai).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /crop_foreground:
    post:
      summary: Crop out foreground
      tags:
        - v2 endpoints
      servers:
        - url: https://engine.prod.bria-api.com/v2/image/edit
      description: >-


        **Description**




        The Crop Route is used to remove the background from an image and crop
        tightly around the foreground or remaining region of interest. It
        supports both images with and without a background.


        **Content Moderation**


        This endpoint includes granular content moderation controls to ensure
        safe usage across all stages of processing:


        - **Input Image Moderation** – Scans the uploaded image and stops
        processing if inappropriate or restricted content is detected.

        - **Output Image Moderation** – Evaluates the generated image and blocks
        the response if it violates safety guidelines.
      operationId: crop
      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  description: >
                    The source image to be handled by the API.  

                    Supported input types:  

                    - **Base64-encoded string**  

                    - **URL** pointing to an image file that is publicly
                    accessible and available at the time of processing.  


                    Accepted formats: **JPEG**, **JPG**, **PNG**, **WEBP**.
                padding:
                  type: integer
                  description: >-
                    Cropping the object with padding around it. Currently,
                    padding is applied to all four borders of the remaining
                    region. This parameter is optional.
                  default: 0
                force_background_detection:
                  type: boolean
                  default: false
                  description: >-
                    When `true`, forces background detection and removal, even
                    if the original image already contains an alpha channel.
                    Useful for refining existing foreground/background
                    separation or ignoring unnecessary alpha channels.
                preserve_alpha:
                  type: boolean
                  default: true
                  description: >
                    Controls whether the alpha channel values from the input
                    image are retained in the output, if the input includes an
                    alpha channel.

                    - When true: The output image maintains the original
                    transparency of fully and partially transparent pixels.

                    - When false: The transparency values from the input are not
                    preserved, but the output may still include an alpha channel
                    (e.g., around the cropped area).

                    - Has no effect if the input image does not include an alpha
                    channel.
                sync:
                  type: boolean
                  default: false
                  description: |
                    Specifies the response mode.
                      - When `false` (default), the request is processed asynchronously: the API immediately returns a status URL to track progress.
                      - When `true`, the request is processed synchronously: the API hold the connection open until the proccess is complete and then returns the final image URL in the response.
                webhook_url:
