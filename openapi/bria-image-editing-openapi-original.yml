      operationId: edit-image
      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - images
              properties:
                images:
                  type: array
                  items:
                    type: string
                  description: >
                    The source image to be edited. Publicly available URL or
                    Base64-encoded. 

                    Accepted formats: JPEG, JPG, PNG, WEBP. 

                    **Must contain exactly one item.**
                instruction:
                  type: string
                  description: >-
                    Text-based edit instruction (e.g., "make the sky blue", "add
                    a cat"). This parameter serves as the text prompt.
                mask:
                  type: string
                  description: >
                    Publicly available URL or Base64-encoded mask image (black
                    and white). 

                    Black areas will be preserved, white areas will be edited.
                    If omitted, the edit applies to the entire image. 

                    The input image and the input mask must be of the same size.

                    This parameter is optional.
                structured_instruction:
                  type: string
                  description: >-
                    A string containing the structured edit instruction in JSON
                    format. Use this instead of `instruction` for precise,
                    programmatic control.
                negative_prompt:
                  type: string
                  description: >-
                    A text prompt specifying concepts, styles, or objects to
                    exclude from the edited image. This parameter is optional.
                guidance_scale:
                  type: integer
                  default: 5
                  minimum: 3
                  maximum: 5
                  description: >-
                    Determines how closely the generated image should adhere to
                    the content in the instruction or structured_instruction.
                    This parameter is optional.
                model_version:
                  type: string
                  default: FIBO-edit
                  enum:
                    - FIBO-edit
                  description: >
                    The version of the model to use. This parameter is optional.

                    If omitted (Default): Your request will automatically use
                    Bria's current default model version (currently FIBO-edit).

                    If specified: Your request will be pinned to this exact
                    version.
                steps_num:
                  type: integer
                  default: 30
                  minimum: 20
                  maximum: 50
                  description: >-
                    Number of diffusion steps. Uses model default if omitted.
                    This parameter is optional.
                seed:
                  type: integer
                  description: >-
                    Seed for deterministic generation. Uses a random seed if
                    omitted. This parameter is optional.
                sync:
                  type: boolean
                  default: false
                  description: |
                    Specifies the response mode. This parameter is optional.
                      - When `false` (default), the request is processed asynchronously: the API immediately returns a status URL to track progress.
                      - When `true`, the request is processed synchronously: the API hold the connection open until the proccess is complete and then returns the final image URL in the response.
                webhook_url:
                  type: string
                  format: uri
                  description: >-
                    Optional URL for receiving the result via webhook when the
                    async job completes. See
                    [Webhooks](https://docs.bria.ai/webhooks).
                output_type:
                  type: string
                  default: png
                  enum:
                    - png
                    - jpeg
                  description: The desired output format
                ip_signal:
                  type: boolean
                  default: false
                  description: >-
                    If true, returns a warning for potential IP content in the
                    instruction. This parameter is optional.
                prompt_content_moderation:
                  type: boolean
                  default: true
                  description: >-
                    If true, returns 422 on instruction moderation failure. This
                    parameter is optional.
                visual_input_content_moderation:
                  type: boolean
                  default: true
                  description: >-
                    If true, returns 422 on images or mask moderation failure.
                    This parameter is optional.
                visual_output_content_moderation:
                  type: boolean
                  default: true
                  description: >-
                    If true, returns 422 on visual output moderation failure.
                    This parameter is optional.
            examples:
              text_instruction:
                summary: Global Edit by Text Instruction
                value:
                  instruction: >-
                    change color pallet of the image to: #014040, #02735E,
                    #03A678, #F27405, #731702
                  images:
                    - >-
                      https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-edit/pexels-cottonbro-3401900.jpg
              json_instruction:
                summary: Edit by Structured Instruction
                value:
                  images:
                    - >-
                      https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-edit/42082.jpg
                  structured_instruction: >-
                    {"short_description":"A realistic photograph of a brown
