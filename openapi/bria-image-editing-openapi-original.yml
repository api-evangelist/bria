paths:
  /image/edit:
    post:
      summary: Image Edit by Text
      tags:
        - v2 endpoints
      servers:
        - url: https://engine.prod.bria-api.com/v2
      description: >-
        [**Try out this capability in Bria's
        sandbox**](https://platform.bria.ai/image-editing/fibo-image-edit)



        **Description**


        Powered by the **FIBO models family**, Bria’s Image Editing by Text API
        equips builders with the ability to modify existing images using natural
        language instructions or structured JSON instructions.


        FIBO Edit features **native masking support** for precise, localized
        editing. You can supply a binary mask to restrict changes to specific
        regions while preserving the rest of the image. 


        The masking logic operates as a **generative replacement**; the model
        generates entirely new content within the masked area based on your
        instruction, rather than modifying the existing pixels.


        **Core Technology: The FIBO Architecture**


        This endpoint utilizes the **FIBO** architecture, a unique two-step
        process ensuring precise and controllable edits:

        1.  **Translation:** A VLM Bridge (powered by **Gemini 2.5 Flash**)
        converts your inputs into a detailed `structured_instruction` (JSON).

        2.  **Generation:** The FIBO Edit model performs the final,
        deterministic edit on the input image, based on that JSON.


        **Advanced Control & Recreation**


        * To recreate a specific result: You must provide the exact source
        images, the mask (if used), the `structured_instruction` returned in the
        original response, and the `seed` used to create it.

        * For advanced, programmatic control, you can pass in your own
        `structured_instruction` (e.g., from the
        `/v2/structured_instruction/generate` endpoint) to bypass the internal
        VLM bridge.


        ---


        **Input Combination Rules**


        The request body must include `images` and one of the following
        combinations:


        * **Global Edit (natural language):** `images` + `instruction`

        * **Global Edit (JSON instruction):** `images` +
        `structured_instruction`

        * **Masked Edit (natural language):** `images` + `mask` + `instruction`

        * **Masked Edit (JSON instruction):** `images` + `mask` +
        `structured_instruction`


        ---

        **API Access**


        You can register and access the API Token through Bria's platform <a
        href="https://platform.bria.ai/console/account/api-keys"
        target="_blank">by clicking here</a>.


        ---

