  /erase:
    post:
      summary: Eraser
      tags:
        - v2 endpoints
      servers:
        - url: https://engine.prod.bria-api.com/v2/image/edit
      description: >-
        [**Try out this capability in Bria's
        sandbox**](https://platform.bria.ai/image-editing/eraser)


        **Description**



        The *Eraser Route* enables the removal of elements or specific areas
        from a given image.



        You can define the area to be removed by providing a mask that outlines
        the region to be erased. There are two main ways recommended to generate
        these masks:


        1. Masks can be created by allowing users to draw directly on the image
        with a brush, for example. To access the SDK that demonstrates how to
        implement a brush feature in your interface, please refer to the
        following <a
        href="https://github.com/Bria-AI/js-api-sdk/blob/main/manual_brush_ui"
        target="_blank">link</a>.


        2. By using the `/objects/mask_generator` route, which will generate all
        the possible masks for an image.



        **Output Characteristics**


        - The modified image is returned at the original resolution, preserving
        full visual quality without any automatic resizing or downscaling.

        - All areas outside the provided mask remain completely unchanged,
        ensuring pixel-perfect preservation of unedited regions.
      operationId: erase
      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - image
                - mask
              properties:
                image:
                  type: string
                  description: >
                    The source image to be handled by the API.  

                    Supported input types:  

                    - **Base64-encoded string**  

                    - **URL** pointing to an image file that is publicly
                    accessible and available at the time of processing.  


                    Accepted formats: **JPEG**, **JPG**, **PNG**, **WEBP**.
                mask:
                  type: string
                  description: >
                    The binary mask image that defines the region where object
                    generation will occur.


                    **Mask Requirements**

                    - The region to generate content must have a pixel value of
                    **255 (white)**.

                    - All other areas must have a pixel value of **0 (black)**.

                    - The mask must have the **same aspect ratio** as the input
                    image.


                    **Supported Input Types**

                    - **Base64-encoded string** – provide the mask data directly
                    in the request.

                    - **URL** – provide a publicly accessible URL to the mask
                    image.


                    Accepted formats: **JPEG**, **JPG**, **PNG**, **WEBP**.


                    Ensure that any provided URL is publicly accessible at the
                    time of the request.
                mask_type:
                  type: string
                  default: manual
                  enum:
                    - manual
                    - automatic
                  description: >
                    Specifies how the input mask was created.


                    - **`manual` (default)** – Use when the mask was generated
                    by a user, for example, using a brush tool.  

                    - **`automatic`** – Use when the mask was generated by an
                    algorithm, such as **SAM** or other automated segmentation
                    methods.
                preserve_alpha:
                  type: boolean
                  default: true
                  description: >
                    Controls whether the alpha channel values from the input
                    image are retained in the output, if the input includes an
                    alpha channel.

                    - When true: The output image maintains the original
                    transparency of fully and partially transparent pixels.

                    - When false: The output image is fully opaque.

                    - Has no effect if the input image does not include an alpha
                    channel.
                sync:
                  type: boolean
                  default: false
                  description: |
                    Specifies the response mode.
                      - When `false` (default), the request is processed asynchronously: the API immediately returns a status URL to track progress.
                      - When `true`, the request is processed synchronously: the API hold the connection open until the proccess is complete and then returns the final image URL in the response.
                webhook_url:
                  type: string
                  format: uri
                  description: >-
                    Optional URL for receiving the result via webhook when the
                    async job completes. See
                    [Webhooks](https://docs.bria.ai/webhooks).
                visual_input_content_moderation:
                  type: boolean
                  default: false
                  description: >
                    When enabled, applies content moderation to input visual.


                    Expected behavior:

                    - Processing stops if the image fails moderation.

                    - Returns a 422 error with details about which parameter
                    failed.
                visual_output_content_moderation:
                  type: boolean
                  default: false
                  description: >
                    When enabled, applies content moderation to result visual.


                    Expected behavior:

                    - If the modified image fails moderation, returns a 422
                    error.
            examples:
              send using url:
                value:
                  image: >-
                    https://labs-assets.bria.ai/sandbox-example-inputs/eraser_image_example.jpg
                  mask: >-
                    https://labs-assets.bria.ai/sandbox-example-inputs/eraser_mask_example.jpg
      responses:
        '200':
          description: Successful operation (Synchronous Success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSuccessResponse'
        '202':
          description: >-
            Accepted (Asynchronous). You can track the progress and retrieve the
            final result using the Status Service. For more details, refer to
            the [Status Service](https://docs.bria.ai/status) section.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncInitialResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found. Image could not be found at the provided URL.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: Unsupported media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Request limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '460':
          description: Failed to download image.
