  /tailored-gen/generate_visual_schema:
    post:
      summary: Generate Visual Schema
      tags:
      - Dataset
      servers:
      - url: https://engine.prod.bria-api.com/v1
      description: 'Generates a structured JSON visual schema (backbone) based on the provided sample images.


        The visual schema represents mutual characteristics (style, IP, colors, etc.) across training images and is used for:

        1. Caption generation during image upload.

        2. Prompt translation (user text → structured prompt) during generation.


        **Usage:**

        - Provide 5-10 representative images of your style/IP.

        - The returned `visual_schema` string must be added to your dataset using `PUT /tailored-gen/datasets/{dataset_id}`.


        This endpoint supports content moderation via an optional parameter.

        '
      operationId: generate-visual-schema
      parameters:
      - in: header
        name: api_token
        schema:
          type: string
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - images
              properties:
                images:
                  type: array
                  minItems: 5
                  maxItems: 10
                  items:
                    type: string
                  description: An array of 5-10 images. Supports base64-encoded strings or public URLs. Supported formats are png, jpg, jpeg, webp.
                content_moderation:
                  type: boolean
                  default: false
      responses:
        '200':
          description: Successfully generated visual schema.
          content:
            application/json:
              schema:
                type: object
                properties:
                  visual_schema:
                    type: string
                    description: A string containing the structured JSON visual schema.
              example:
                visual_schema: '{"style": "...", "colors": "..."}'
        '400':
          description: Bad request (invalid number of images).
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '415':
          description: Unsupported Media Type.
        '422':
          description: Unprocessable Entity (moderation failure).
        '429':
          description: Request limit exceeded.
        '500':
          description: Internal server error.
  /tailored-gen/refine_structured_prompt:
    post:
      summary: Refine Structured Prompt
      tags:
      - Dataset
      servers:
      - url: https://engine.prod.bria-api.com/v1
      description: 'Refines a Structured Prompt object (such as a Visual Schema or an Image Caption) based on user instructions.


        **Access Control & Validation:**

        * Requires a valid `dataset_id` to verify ownership.

        * The referenced dataset must be in `draft` mode.


        **Use Cases:**

        1. **Refine Visual Schema:** Input the initial schema and instructions like "Make the style description more detailed".

        2. **Refine Image Caption:** Input a specific image''s caption and instructions like "Fix the description of the hair color".

        '
      operationId: refine-json
      parameters:
      - in: header
        name: api_token
        schema:
          type: string
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - dataset_id
              - structured_prompt
              - instruction
              properties:
                dataset_id:
                  type: integer
                  description: The ID of the dataset associated with this refinement.
                structured_prompt:
                  type: string
                  description: The current structured prompt string (Visual Schema or Caption) to be refined.
                instruction:
                  type: string
                  description: Natural language instruction describing how to modify the JSON.
                context_images:
                  type: array
                  items:
                    type: string
                  description: Optional. List of image URLs or Base64 strings to provide visual context.
            examples:
              Refine Schema:
                value:
                  dataset_id: 456
                  structured_prompt: '{"style": "cartoon", "colors": ["red", "blue"]}'
                  instruction: Change the style to 'realistic 3D render' and remove blue from colors.
      responses:
        '200':
          description: Successfully refined JSON.
          content:
            application/json:
              schema:
                type: object
                properties:
                  structured_prompt:
                    type: string
                    description: The refined Structured Prompt string.
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Dataset not found.
        '429':
          description: Rate limit exceeded.
        '500':
          description: Internal server error.
