info:
  title: Tailored Generation API Reference Video Generation API
  version: ''
  description: 'Tailored Generation provides capabilities to generate visuals (photos, illustrations, vectors)

    that preserve and faithfully reproduce specific IP elements or guidelines, ensuring consistency

    across all generated outputs. The Tailored Generation APIs allow you to manage and train tailored models that maintain the

    integrity of your visual IP. You can train models through our Console or implement training

    directly via API. **Fully Automated Training Mode**

    Bria supports users in training high-quality finetuned models without the guesswork. Based on the selected IP type & dataset, Bria automatically selects the right training parameters. This means that the user only needs to spend time curating their dataset. **Advanced Customization and Access:** Bria offers 2 types of advanced training customization: Expert training mode and source-code & weights. - **Expert training mode** is for LoRa Finetune experts and provides the ability to finetune training parameters and upload larger training datasets. - **Source-code & Weights** is for developers seeking deeper customization and access to Bria''s source-available GenAI models via Hugging Face. All methods allow full control over fine-tuning, pipeline creation, and integration into proprietary workflows—empowering AI teams to develop and optimize their own generative AI solutions. The Tailored Generation Training API provides a set of endpoints to manage the entire lifecycle

    of a tailored generation project:


    1. **Project Management**: Create and manage projects that define IP characteristics:

    - **Create and Retrieve Projects**: Use the `/projects` endpoints to create a new project or

    retrieve existing projects that belong to your organization. - **Define IP Type**: Specify the IP type (e.g., multi_object_set, defined_character,

    stylized_scene) and medium. - **Manage Project Details**: Use the `/projects/{id}` endpoints to update or delete

    specific projects. 2. **Dataset Management**: Organize and refine datasets within your projects:

    - **Create and Retrieve Datasets**: Use the `/datasets` endpoints to create new datasets or

    retrieve existing ones. - **Generate a Visual Schema**

    - Use `/tailored-gen/generate_visual_schema` to create a structured visual schema using 5-10 sample images. - **Refine Structured Data**

    - Use `/tailored-gen/refine_structured_prompt` to iterate on your **Visual Schema** or **Image Captions** using natural language instructions. - *Example:* You can send your generated schema with the instruction "Character''s name is Lucy" to improve the training metadata programmatically. - **Upload and Manage Images**:

    - **Basic upload**: Use `/datasets/{dataset_id}/images` to upload up to 200 images individually. - **Bulk upload**: Use `/datasets/{dataset_id}/images/bulk` to upload zip files with >200 high-quality images (Advanced). - **Clone Datasets**: Create variations of existing datasets using the clone functionality. 3. **Model Management**: Train and optimize tailored models based on your datasets:

    - **Create and Retrieve Models**: Use the `/models` endpoints to create new models or list

    existing ones. - **Choose training mode**: Select between Fully automated mode (automatic training based on Bria''s recipes) and Expert mode (for training parameter tweaking). - **Monitor and Control**: Manage the model lifecycle, including training start/stop,

    status monitoring, and version control over the training parameters. 4. **Generation Capabilities**:

    - **Image Generation**: Use `/image/generate/tailored` for text-to-image generation. - **Structured Prompting**: Use `/structured_prompt/generate/tailored` to create structured prompts via VLM before generation. - **Video Generation**: Use `/video/generate/tailored/image-to-video` to animate tailored images. ### **Training Process**


    To train a tailored model:


    1. **Create a Project**: Use the `/projects` endpoint to define your IP type and medium. 2.'
servers:
- url: https://engine.prod.bria-api.com/v2/
tags:
- name: Video Generation
  description: Image-to-Video capabilities
paths:
  /video/generate/tailored/image-to-video:
    post:
      summary: Generate Video from Tailored Image (Beta)
      description: '(Beta)

        Initiates an asynchronous job to generate a 5-second MP4 video file animating a source image created by a tailored model.


        **Asynchronous Requests and the Status Service** Bria API endpoints process requests asynchronously by default. When you make an asynchronous request, the API immediately returns a `request_id` and a `status_url` instead of the final result. Use the Status Service to track the request''s progress until it reaches a completed state.


        See the full guide at Status Service Documentation for complete details and usage examples.


        On successful initiation, this endpoint returns a 202 Accepted response. Poll the `status_url` or use the Status Service with the `request_id` to check for job completion.

        Once ''Completed'', the status response will contain the URL to the generated MP4 video.'
      tags:
      - Video Generation
      servers:
      - url: https://engine.prod.bria-api.com/v2
      operationId: generate-video-from-tailored-image
      parameters:
      - in: header
        name: api_token
        schema:
          type: string
        required: true
        description: Your API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tailored_model_id:
                  type: string
                  description: The ID of the tailored model that generated the input image.
                image:
                  type: string
                  description: Publicly accessible URL or base64 string of the source image.
                seed:
                  type: integer
                  description: Optional seed for reproducible results.
              required:
              - tailored_model_id
              - image
            example:
              tailored_model_id: your_tailored_model_id
              image: https://example.com/image.png
              seed: 42
      responses:
        '202':
          description: Accepted. The video generation job was successfully initiated. You can track the progress and retrieve the final result using the Status Service. For more details, refer to the [Status Service](https://docs.bria.ai/status) section.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: The unique identifier for this asynchronous request.
                  status_url:
                    type: string
                    format: uri
                    description: The URL to poll for the status of the generation job.
        '400':
          description: Bad Request. Invalid request body.
        '401':
          description: Unauthorized. The api_token is missing or invalid.
        '403':
          description: Forbidden.
        '404':
          description: Not Found. The specified tailored_model_id does not exist.
        '415':
          description: Unsupported Media Type.
        '422':
          description: Unprocessable Entity. Invalid image data.
        '429':
          description: Too Many Requests. Rate limit exceeded.
        '500':
          description: Internal Server Error.
