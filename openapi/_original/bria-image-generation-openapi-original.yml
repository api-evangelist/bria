      operationId: image-generate
      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: >
                    Text-based instruction. Can be used alone to create a new
                    prompt, or as a refinement command with an `images` or
                    `structured_prompt`.
                images:
                  type: array
                  items:
                    type: string
                  maxItems: 1
                  description: >
                    Publicly available URL or Base64-encoded image. Currently
                    supports a single image. 

                    Supported formats: **JPEG**, **JPG**, **PNG**, **WEBP**.
                structured_prompt:
                  type: string
                  description: >
                    A string containing the structured prompt in JSON format.
                    Use a `structured_prompt` from a previous generation's
                    response or the `/v2/structured_prompt/generate` endpoint
                    for precise refinement.
                resolution:
                  type: string
                  default: 1MP
                  description: >-
                    Output image resolution. "4MP" improves image details,
                    especially for photorealism, but will increase latency by 30
                    seconds.
                  enum:
                    - 1MP
                    - 4MP
                negative_prompt:
                  type: string
                  description: >-
                    A text prompt specifying concepts, styles, or objects to
                    exclude from the generated image. This parameter is
                    optional.
                model_version:
                  type: string
                  description: >
                    Generation model version. This parameter is optional.

                    * **If omitted (Default)**: Your request will automatically
                    use Bria's current default model. This ensures you always
                    benefit from our latest improvements.

                    * **If specified (e.g., "FIBO")**: Your request will be
                    pinned to this exact version.
                  enum:
                    - FIBO
                aspect_ratio:
                  type: string
                  description: Image aspect ratio. This parameter is optional.
                  default: '1:1'
                  enum:
                    - '1:1'
                    - '2:3'
                    - '3:2'
                    - '3:4'
                    - '4:3'
                    - '4:5'
                    - '5:4'
                    - '9:16'
                    - '16:9'
                steps_num:
                  type: integer
                  description: >-
                    Number of diffusion steps. Uses model default if omitted.
                    This parameter is optional.
                  default: 50
                  minimum: 35
                  maximum: 50
                seed:
                  type: integer
                  description: >-
                    Seed for deterministic generation. Uses a random seed if
                    omitted. This parameter is optional.
                sync:
                  type: boolean
                  default: false
                  description: >
                    Response mode. This parameter is optional.

                    * `false` (default): Asynchronous. Returns 202 with a
                    `status_url` to poll.

                    * `true`: Synchronous. Holds the connection and returns 200
                    with the final result.
                webhook_url:
                  type: string
                  format: uri
                  description: >-
                    Optional URL for receiving the result via webhook when the
                    async job completes. See
                    [Webhooks](https://docs.bria.ai/webhooks).
                output_type:
                  type: string
                  default: png
                  enum:
                    - png
                    - jpeg
                  description: The desired output format
                ip_signal:
                  type: boolean
                  default: false
                  description: >-
                    If true, returns a warning for potential IP content in the
                    `prompt` parameter. This parameter is optional.
                prompt_content_moderation:
                  type: boolean
                  default: true
                  description: >-
                    If true, returns 422 on input prompt moderation failure in
                    the `prompt` parameter. This parameter is optional.
                visual_input_content_moderation:
                  type: boolean
                  default: true
                  description: >-
                    If true, returns 422 on visual input moderation failure.
                    This parameter is optional.
                visual_output_content_moderation:
                  type: boolean
                  default: true
                  description: >-
                    If true, returns 422 on visual output moderation failure.
                    This parameter is optional.
            examples:
              Generate a new image using a textual prompt:
                value:
                  prompt: >-
                    A photorealistic, high-resolution rendering of balloon
                    lettering spelling out "HAPPY NEW YEAR 2026" against a
                    pristine white backdrop. The balloons are meticulously
                    crafted with a metallic, reflective surface, showcasing a
                    vibrant color palette of Pantone Bran, Crocus, and Deja vu
                    blue. The composition is perfectly aligned and balanced,
                    emphasizing the celebratory message with natural, soft
                    lighting that creates subtle, elegant reflections and
                    shadows.
              Generate an image inspired by a reference image:
                value:
                  prompt: a ring inspired by the image
                  images:
                    - >-
                      https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo/ref_1.jpg
              Generate an image using only a reference image:
                summary: Generate an image inspired by only a reference image
                value:
                  images:
                    - >-
                      https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo/ref_1.jpg
              Refine a previously generated image using its structured_prompt and seed:
                value:
                  prompt: add sunlight
                  structured_prompt: >-
                    {"short_description":"A close-up, photorealistic image of an
                    ultra-fluffy owl perched on a tree branch at night. The
                    owl's large, expressive eyes gaze directly at the viewer,
                    conveying curiosity and charm. Its voluminous feathers, a
                    mix of soft browns and creams, are subtly illuminated by
                    cool moonlight, revealing delicate silver highlights. The
                    background is a soft blur of dark, leafy trees, enhancing
                    the owl's prominence and creating a whimsical,
                    storybook-like atmosphere.","objects":[{"description":"A
                    hyper-detailed, ultra-fluffy owl with soft, voluminous
                    feathers. Its head is slightly tilted, and its body is plump
                    and rounded, emphasizing its fluffiness. The feathers are a
                    blend of warm browns, creams, and grays, with individual
                    strands visible and catching subtle silver highlights from
                    the moonlight.","location":"center","relationship":"The
                    primary subject, perched on a tree branch, looking directly
                    at the viewer.","relative_size":"large within
                    frame","shape_and_color":"Rounded, plump body with a
                    distinct head; mottled browns, creams, and grays with silver
                    highlights.","texture":"Extremely soft, downy, and
                    voluminous feathers.","appearance_details":"Large, round,
                    dark eyes with a bright, curious, and charming expression.
                    The eyes reflect a tiny pinpoint of moonlight, adding to
                    their expressiveness. Small, dark beak partially hidden by
                    feathers.","expression":"Curious, charming, and adorable
                    with wide, expressive eyes.","orientation":"Facing directly
                    forward, head slightly tilted to its
                    right."},{"description":"A sturdy, dark tree branch,
                    partially visible, providing a perch for the owl. Its
                    surface is rough and textured, suggesting aged
                    bark.","location":"bottom-center","relationship":"Supports
                    the owl, providing its
                    perch.","relative_size":"medium","shape_and_color":"Irregular,
                    horizontal shape; dark brown to black.","texture":"Rough,
                    gnarled bark.","appearance_details":"Some moss or lichen
                    might be subtly visible on its
                    surface.","orientation":"Horizontal, extending from left to
                    right across the lower part of the
                    frame."}],"background_setting":"A dense, dark forest at
