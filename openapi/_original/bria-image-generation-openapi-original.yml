          example: 123
        message:
          type: string
        details:
          type: string
      required:
        - code
        - message
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
        request_id:
          type: string
      required:
        - error
        - request_id
    AsyncInitialResponseWithWarning:
      type: object
      properties:
        request_id:
          type: string
        status_url:
          type: string
        warning:
          type: string
          description: >-
            Returned only when ip_signal = true and the prompt field included IP
            content.
      required:
        - request_id
        - status_url
    SyncSuccessImageGenerate:
      type: object
      properties:
        result:
          type: object
          properties:
            image_url:
              type: string
