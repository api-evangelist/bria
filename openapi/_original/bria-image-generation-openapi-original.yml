      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - structured_prompt
                - user_adjusted_structured_prompt
              properties:
                structured_prompt:
                  type: string
                  description: >
                    A string containing the original structured prompt in JSON
                    format.
                user_adjusted_structured_prompt:
                  type: string
                  description: >
                    A string containing the manually modified structured prompt
                    in JSON format.
                seed:
                  type: integer
                  description: >-
                    Seed for deterministic generation. Uses a random seed if
                    omitted.
                sync:
                  type: boolean
                  default: false
                  description: |
