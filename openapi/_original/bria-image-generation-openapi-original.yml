  /image/generate/lite:
    post:
      summary: Generate Image - Lite
      tags:
        - Endpoints
      servers:
        - url: https://engine.prod.bria-api.com/v2
      description: >-
        [**Try out this capability in Bria's
        sandbox**](https://platform.bria.ai/image-generation/fibo-lite-generate/sandbox)



        **Description**


        Generates a new image based on your inputs using the **fast and
        efficient Fibo Lite Pipeline**.


        This all-in-one endpoint utilizes a two-step local-compatible process:

        1. **FIBO-VLM Bridge:** Translates your input (`prompt` and/or `images`)
        into a structured JSON prompt using Bria's efficient open-source VLM,
        optimized for rapid inference.

        2. **Fibo Lite Model:** Internally uses the distilled Fibo Lite
        text-to-image model to generate the final visual. This model is
        engineered for **low latency**, ensuring faster generation times.


        **Fibo Lite's Benefits**


        This pipeline is designed for **speed and privacy**. It delivers
        significantly faster generation times suitable for high-throughput
        workflows. 


        Additionally, by pairing the distilled Fibo Lite text-to-image model
        with the FIBO-VLM bridge, the entire pipeline is capable of **fully
        local, on-prem deployment**.


        To access the local deployment package, please contact us at <a
        href="mailto:support@bria.ai">support@bria.ai</a>.


        For advanced, programmatic control, you can also pass in your own
        `structured_prompt` (e.g., from a previous response or the
        `/v2/structured_prompt/generate/lite` endpoint) to bypass the internal
        VLM bridge. This allows for precise, auditable refinement or recreation
        of an image, or to generate multiple variations from the same structured
        prompt.


        ---


        **Input Combination Rules**


        The request body must include **one** of the following mutually
        exclusive combinations:


        * `prompt` (Generates a new image from text)

        * `images` (Generates a new image inspired by a reference image)

        * `images` + `prompt` (Generates a new image inspired by an image and
        guided by text)

        * `structured_prompt` (Recreates a previous image exactly, combined with
        a seed)

        * `structured_prompt` + `prompt` (Refines a previous image using new
        text instructions, combined with a seed)


        ---

        ** API Access **


        You can register and access the API Token through Bria's platform <a
        href="https://platform.bria.ai/console/account/api-keys"
        target="_blank">by clicking here</a>.


        ---

        ***Examples***


        **Use Case 1: Using a textual prompt**


        * **Input Prompt:** `photorealistic, high resolution rendering, balloon
        of lettering, "HAPPY NEW YEAR 2026", used color is Pantone Bran, Crocus,
        Deja vu blue, perfect composition and alignment, natural light set,
        white backdrop, ultra realistic, rich detail`

        * **Output Image:** ![Example of text-to-image
        output](https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-lite/new_year_2026.png)

        * **Output `structured_prompt`:**
            ```json
            
