  /structured_prompt/generate:
    post:
      summary: Generate Structured Prompt
      tags:
        - Endpoints
      servers:
        - url: https://engine.prod.bria-api.com/v2
      description: >
        Creates a new detailed, machine-readable structured prompt in JSON
        format or refines an existing one using text or image inputs.


        This endpoint uses the state-of-the-art **Gemini 2.5 Flash** VLM bridge
        to generate the prompt, providing superior understanding of nuanced or
        complex inputs. It **only returns the JSON string** and does not
        generate an image.


        **Why use this endpoint?**


        This endpoint decouples the "intent translation" step from the "image
        generation" step, giving you maximum flexibility.


        * **It's Optional:** The same structured prompt generation happens
        automatically behind the scenes when using `/v2/image/generate`.

        * **Control & Auditability:** Allows for a "human-in-the-loop" to
        inspect, programmatically edit, or version the JSON *before* generating
        an image (e.g., for a custom UI).

        * **Consistency & Automation:** Generate one `structured_prompt` and
        pass it to `/v2/image/generate` multiple times to create consistent,
        auditable variations.

        * **Hybrid Deployment:** Use Bria's state-of-the-art VLM bridge via API
        while self-hosting the open-source FIBO image model on your own private
        cloud.


        The resulting `structured_prompt` can be used as input for the
        `/v2/image/generate` endpoint.


        **Input Combination Rules**


        The request body must use exactly one of the following combinations:

        * **Text Only**: `prompt`

        * **Image Only**: `images`

        * **Image and Text**: `images` and `prompt`

        * **Structured Prompt and Text**: `structured_prompt` and `prompt`


        ---

        ** API Access **


        You can register and access the API Token through Bria's platform <a
        href="https://platform.bria.ai/console/account/api-keys"
        target="_blank">by clicking here</a>.
      operationId: structured-prompt-generate
      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: >
                    Text-based instruction. Can be used alone to create a new
                    prompt, or as a refinement command with an `images` or
                    `structured_prompt`.
                images:
                  type: array
                  items:
                    type: string
                  maxItems: 1
                  description: >
                    Publicly available URL or Base64-encoded image. Currently
                    supports a single image. 

                    Supported formats: **JPEG**, **JPG**, **PNG**, **WEBP**.
                structured_prompt:
                  type: string
                  description: >
                    A string containing the structured prompt in JSON format.
                    Use a `structured_prompt` from a previous generation's
                    response.
                seed:
                  type: integer
                  description: >-
                    Seed for deterministic generation. Uses a random seed if
                    omitted. This parameter is optional.
                sync:
                  type: boolean
                  default: false
                  description: >
                    Response mode. This parameter is optional.

                    * `false` (default): Asynchronous. Returns 202 with a
                    `status_url` to poll.

                    * `true`: Synchronous. Holds the connection and returns 200
                    with the final result.
                webhook_url:
                  type: string
                  format: uri
                  description: >-
                    Optional URL for receiving the result via webhook when the
                    async job completes. See
                    [Webhooks](https://docs.bria.ai/webhooks).
                ip_signal:
                  type: boolean
                  default: false
                  description: >-
                    If true, returns a warning for potential IP content in the
                    `prompt` parameter. This parameter is optional.
                prompt_content_moderation:
                  type: boolean
                  default: true
                  description: >-
                    If true, returns 422 on input prompt moderation failure in
                    the `prompt` parameter. This parameter is optional.
                visual_input_content_moderation:
                  type: boolean
                  default: true
                  description: >-
                    If true, returns 422 on visual input moderation failure.
                    This parameter is optional.
            examples:
              Text Only:
                value:
                  prompt: >-
                    A photorealistic, high-resolution rendering of balloon
                    lettering spelling out "HAPPY NEW YEAR 2026" against a
                    pristine white backdrop. The balloons are meticulously
                    crafted with a metallic, reflective surface, showcasing a
                    vibrant color palette of Pantone Bran, Crocus, and Deja vu
                    blue. The composition is perfectly aligned and balanced,
                    emphasizing the celebratory message with natural, soft
                    lighting that creates subtle, elegant reflections and
                    shadows.
              Image Only:
                value:
                  images:
                    - >-
                      https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo/ref_1.jpg
              Image and Text:
                value:
                  images:
                    - >-
                      https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo/ref_1.jpg
                  prompt: a ring inspired by the image
              Structured Prompt and Text:
                value:
                  structured_prompt: >-
                    {"short_description":"A close-up, photorealistic image of an
                    ultra-fluffy owl perched on a tree branch at night. The
                    owl's large, expressive eyes gaze directly at the viewer,
                    conveying curiosity and charm. Its voluminous feathers, a
                    mix of soft browns and creams, are subtly illuminated by
                    cool moonlight, revealing delicate silver highlights. The
                    background is a soft blur of dark, leafy trees, enhancing
                    the owl's prominence and creating a whimsical,
                    storybook-like atmosphere.","objects":[{"description":"A
                    hyper-detailed, ultra-fluffy owl with soft, voluminous
                    feathers. Its head is slightly tilted, and its body is plump
                    and rounded, emphasizing its fluffiness. The feathers are a
                    blend of warm browns, creams, and grays, with individual
                    strands visible and catching subtle silver highlights from
                    the moonlight.","location":"center","relationship":"The
                    primary subject, perched on a tree branch, looking directly
                    at the viewer.","relative_size":"large within
                    frame","shape_and_color":"Rounded, plump body with a
                    distinct head; mottled browns, creams, and grays with silver
                    highlights.","texture":"Extremely soft, downy, and
                    voluminous feathers.","appearance_details":"Large, round,
                    dark eyes with a bright, curious, and charming expression.
                    The eyes reflect a tiny pinpoint of moonlight, adding to
                    their expressiveness. Small, dark beak partially hidden by
                    feathers.","expression":"Curious, charming, and adorable
                    with wide, expressive eyes.","orientation":"Facing directly
                    forward, head slightly tilted to its
                    right."},{"description":"A sturdy, dark tree branch,
                    partially visible, providing a perch for the owl. Its
                    surface is rough and textured, suggesting aged
                    bark.","location":"bottom-center","relationship":"Supports
                    the owl, providing its
                    perch.","relative_size":"medium","shape_and_color":"Irregular,
                    horizontal shape; dark brown to black.","texture":"Rough,
                    gnarled bark.","appearance_details":"Some moss or lichen
                    might be subtly visible on its
                    surface.","orientation":"Horizontal, extending from left to
                    right across the lower part of the
                    frame."}],"background_setting":"A dense, dark forest at
                    night. The background consists of blurred, indistinct shapes
                    of tree trunks and foliage, suggesting depth and a natural,
                    nocturnal environment. A faint, ethereal glow from the moon
                    filters through the canopy.","lighting":{"conditions":"Cool
                    moonlight, nighttime.","direction":"Softly diffused from
                    above and slightly to the front, highlighting the owl's
                    features.","shadows":"Soft, subtle shadows on the owl's
                    underside and within the tree branches, adding depth without
                    obscuring details. The background is largely in deep
                    shadow."},"aesthetics":{"composition":"Centered, close-up
                    portrait composition, with the owl filling a significant
                    portion of the frame.","color_scheme":"Cool blues, grays,
                    and dark greens in the background, contrasting with the warm
                    browns and creams of the owl, accented by silver
                    highlights.","mood_atmosphere":"Whimsical, enchanting,
                    serene, and slightly mysterious.","preference_score":"very
                    high","aesthetic_score":"very
                    high"},"photographic_characteristics":{"depth_of_field":"Shallow,
                    with the owl in sharp focus and the background softly
                    blurred (bokeh).","focus":"Sharp focus on the owl's eyes and
                    face, with a gradual fall-off of focus towards its body and
                    the branch.","camera_angle":"Eye-level, as if directly
                    encountering the owl.","lens_focal_length":"Portrait lens
                    (e.g., 85mm-100mm) to achieve a tight crop and shallow depth
                    of field."},"style_medium":"photograph","context":"This is a
                    concept for a high-quality, photorealistic image intended
                    for nature photography, children's book illustrations, or a
                    whimsical art print.","artistic_style":"realistic, detailed,
                    ethereal"}
                  prompt: add sunlight
      responses:
        '200':
          description: Successful operation (Synchronous Success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSuccessStructPromptGenerate'
        '202':
          description: >-
            Accepted (Asynchronous). You can track the progress and retrieve the
            final result using the Status Service. For more details, refer to
            the [Status Service](https://docs.bria.ai/status) section.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncInitialResponseWithWarning'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Unprocessable Entity (e.g., moderation failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Request limit exceeded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        5XX:
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /structured_prompt/generate_from_diff:
    post:
      summary: Generate Structured Prompt from Diff
      tags:
        - Endpoints
      servers:
        - url: https://engine.prod.bria-api.com/v2
      description: >
        Generates a new, optimized `structured_prompt` by analyzing the semantic
        difference between an original structred_prompt and a user-edited
        version. This endpoint is relevant for applications that allow for
        manual inline structured_prompt editing.
