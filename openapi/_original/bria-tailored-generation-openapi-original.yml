  /tailored-gen/models/{model_id}/start_training:
    post:
      summary: Start Training
      tags:
        - Model
      servers:
        - url: https://engine.prod.bria-api.com/v1
      description: >
        Start model training. Training duration is typically 2-4 hours.

        The associated dataset must have a status of 'completed' before training
        can begin.


        **Default Training Parameters:**

        If parameters are not provided, defaults are automatically selected:

        * `rank`: 128

        * `learning_rate`: 0.0001

        * `lr_scheduler`: "constant_with_warmup"

        * `total_training_steps`: 750

        * `checkpoint_interval`: 500
            
        **Constraints:**

        Advanced training parameters are only supported when the model's
        `training_mode` is set to 'expert'.
      operationId: start-training
      parameters:
        - in: path
          name: model_id
          required: true
          schema:
            type: integer
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lr_scheduler:
                  type: string
                  description: The learning rate scheduler.
                  enum:
                    - linear
                    - cosine
                    - cosine_with_restarts
                    - polynomial
                    - constant
                    - constant_with_warmup
                learning_rate:
                  type: number
                  format: float
                  minimum: 0.000001
                  maximum: 0.001
                  description: The initial learning rate. Default is 0.0001.
                total_training_steps:
                  type: integer
                  minimum: 1
                  maximum: 5000
                  description: Total number of training optimization steps. Default is 750.
                rank:
                  type: integer
                  minimum: 4
                  maximum: 256
                  description: The rank (latent dimension). Default is 128.
                checkpoint_interval:
                  type: integer
                  minimum: 100
                  description: >-
                    Interval (in steps) at which checkpoints are saved. Default
                    is 500.
                lr_warmup_steps:
                  type: integer
                  minimum: 0
                  maximum: 1000
                  default: 100
                  description: >-
                    Number of warmup steps. Relevant only when `lr_scheduler` is
                    `constant_with_warmup`.
      responses:
        '200':
          description: Training successfully started
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  description:
                    type: string
                  status:
                    type: string
                    enum:
                      - InProgress
                  dataset_id:
                    type: integer
                  training_mode:
                    type: string
                  project_id:
                    type: integer
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
                  active_model_version:
                    type: string
                  training_parameters:
                    type: object
                    properties:
                      learning_rate:
                        type: number
                        format: float
                      lr_scheduler:
                        type: string
                      rank:
                        type: integer
                      total_training_steps:
                        type: integer
                      checkpoint_interval:
                        type: integer
                      lr_warmup_steps:
                        type: integer
                        nullable: true
                  checkpoint_steps:
                    type: array
                    items:
                      type: string
              example:
                id: 12242
                name: Test Model
                description: Test description
                status: InProgress
                dataset_id: 13749
                training_mode: expert
                project_id: 12429
                created_at: '2025-08-20T09:51:58.080018'
                updated_at: '2025-08-20T09:51:58.080020'
                active_model_version: default
                training_parameters:
                  learning_rate: 0.0001
                  lr_scheduler: constant_with_warmup
                  rank: 128
                  total_training_steps: 750
