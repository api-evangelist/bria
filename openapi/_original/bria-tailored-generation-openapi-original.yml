/tailored-gen/models/upload_model:
  post:
    summary: Upload Model
    tags:
      - Model
    servers:
      - url: https://engine.prod.bria-api.com/v1
    description: >
      Upload a pre-trained tailored model to Bria's infrastructure and run it
      within Bria's ecosystem.


      Model must be in .safetensors format. Maximum model size supported is 3GB.


      You can check the model's status using the
      [`/tailored-gen/models/{model_id}`](https://docs.bria.ai/tailored-generation/endpoints/get-model)
      endpoint. Potential statuses are: "syncing" or "completed".
    operationId: upload-model
    parameters:
      - in: header
        name: api_token
        schema:
          type: string
        required: true
        description: API authentication token.
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              model_url:
                type: string
                description: URL of the tailored model file to be uploaded.
              model_name:
                type: string
                description: Name of the new tailored model.
              project_id:
                type: integer
                description: >-
                  ID of the project the model should be assigned to. If omitted,
                  a new project will be created.
              project_parameters:
                type: object
                description: >-
                  Parameters for creating a new project, required only if
                  `project_id` is not provided.
                properties:
                  project_name:
                    type: string
                    description: Name of the project.
                  ip_medium:
                    type: string
                    enum:
                      - photography
                      - illustration
                    description: Medium of the IP.
                  project_description:
                    type: string
                    description: Description of the project.
                  ip_type:
                    type: string
                    enum:
                      - multi_object_set
                      - object_variants
                      - icons
                      - defined_character
                      - character_variants
                      - stylized_scene
                      - other
                    default: other
                    description: Type of IP for the project.
            required:
              - model_url
    responses:
      '200':
        description: Successful model upload
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                name:
                  type: string
                description:
                  type: string
                status:
                  type: string
                project_id:
                  type: integer
                dataset_id:
                  type: integer
                created_at:
                  type: string
                  format: date-time
            example:
              id: 789
              name: Lora Character Model
              description: A model trained on my character
              status: Completed
              project_id: 123
              dataset_id: 456
              created_at: '2024-05-26T12:00:00Z'
      '400':
        description: Bad request. Missing or invalid parameters.
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              type: string
            examples:
              quota_exceeded:
                value: >-
                  Quota exceeded: Free users can make up to 1000 requests in
                  total. Please upgrade your plan to continue using the service.
              access_denied:
                value: >-
                  Access denied: Your subscription does not include access to
                  this feature/product.
      '404':
        description: Not found.
      '415':
        description: Unsupported Media Type. Invalid file format.
      '422':
        description: >-
          Unprocessable Entity. The provided URL or parameters are invalid or
          inaccessible.
      '429':
        description: >-
          Request limit exceeded. Your account has reached its maximum allowed
          requests.
      '500':
        description: Internal server error.
