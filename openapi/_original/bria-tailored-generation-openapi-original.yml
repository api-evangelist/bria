        - url: https://engine.prod.bria-api.com/v1
      description: >
        Create a new dataset.


        Datasets use JSON structured data (`visual_schema`) for training. You
        must generate a visual schema via `/generate_visual_schema` before
        completing the dataset.


        **Completion Requirements:**

        Minimum 5 images required to mark as completed.


        **Upload types**:

        * **Basic upload type**: Supports up to 200 images, uploading image
        files

        * **Advanced upload type**: Supports up to 5000 images, uploading a zip
        file
      operationId: create-dataset
      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_id:
                  type: integer
                  description: Associated project ID (required)
                name:
                  type: string
                  description: Dataset name (required)
                upload_type:
                  type: string
                  description: The method used to upload images to the dataset.
                  enum:
                    - basic
                    - advanced
                  default: basic
            example:
              project_id: 123
              name: dataset v1
              upload_type: basic
      responses:
        '201':
          description: Dataset successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  project_id:
                    type: integer
                  name:
                    type: string
                  visual_schema:
                    type: string
                    nullable: true
                    description: >-
                      A string containing the JSON structure representing the
                      visual backbone. Must be generated via
                      `/generate_visual_schema`.
                  status:
                    type: string
                    enum:
                      - draft
                  captions_update_status:
                    type: string
                    enum:
                      - empty
                      - in_progress
                      - completed
                  upload_type:
                    type: string
                    enum:
                      - basic
                      - advanced
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
              example:
                id: 456
                project_id: 123
                name: dataset v1
                visual_schema: null
                status: draft
                captions_update_status: empty
