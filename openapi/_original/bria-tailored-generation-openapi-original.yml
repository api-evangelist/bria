openapi: 3.0.0
info:
  title: Tailored Generation API Reference
  version: ''
  description: >
    Tailored Generation provides capabilities to generate visuals (photos,
    illustrations, vectors) 

    that preserve and faithfully reproduce specific IP elements or guidelines,
    ensuring consistency 

    across all generated outputs.


    The Tailored Generation APIs allow you to manage and train tailored models
    that maintain the 

    integrity of your visual IP. You can train models through our Console or
    implement training 

    directly via API.


    **Fully Automated Training Mode**

    Bria supports users in training high-quality finetuned models without the
    guesswork. Based on the selected IP type & dataset, Bria automatically
    selects the right training parameters. 

    This means that the user only needs to spend time curating their dataset.


    **Advanced Customization and Access:** Bria offers 2 types of advanced
    training customization: Expert training mode and source-code & weights.
      - **Expert training mode** is for LoRa Finetune experts and provides the ability to finetune training parameters and upload larger training datasets.
      - **Source-code & Weights** is for developers seeking deeper customization and access to Bria's source-available GenAI models via [Hugging Face](https://huggingface.co/briaai).  

    All methods allow full control over fine-tuning, pipeline creation, and
    integration into proprietary workflows—empowering AI teams to develop and
    optimize their own generative AI solutions.


    The Tailored Generation Training API provides a set of endpoints to manage
    the entire lifecycle 

    of a tailored generation project:


    1. **Project Management**: Create and manage projects that define IP
    characteristics:
      - **Create and Retrieve Projects**: Use the `/projects` endpoints to create a new project or 
        retrieve existing projects that belong to your organization.
      - **Define IP Type**: Specify the IP type (e.g., multi_object_set, defined_character, 
        stylized_scene) and medium.
      - **Manage Project Details**: Use the `/projects/{id}` endpoints to update or delete 
        specific projects.

    2. **Dataset Management**: Organize and refine datasets within your
    projects:
      - **Create and Retrieve Datasets**: Use the `/datasets` endpoints to create new datasets or 
        retrieve existing ones.
      - **Generate a Visual Schema**
        - Use `/tailored-gen/generate_visual_schema` to create a structured visual schema using 5-10 sample images.
      - **Refine Structured Data**
        - Use `/tailored-gen/refine_structured_prompt` to iterate on your **Visual Schema** or **Image Captions** using natural language instructions.
        - *Example:* You can send your generated schema with the instruction "Character's name is Lucy" to improve the training metadata programmatically.
      - **Upload and Manage Images**: 
        - **Basic upload**: Use `/datasets/{dataset_id}/images` to upload up to 200 images individually.
        - **Bulk upload**: Use `/datasets/{dataset_id}/images/bulk` to upload zip files with >200 high-quality images (Advanced).
      - **Clone Datasets**: Create variations of existing datasets using the clone functionality.

    3. **Model Management**: Train and optimize tailored models based on your
    datasets:
      - **Create and Retrieve Models**: Use the `/models` endpoints to create new models or list 
        existing ones.
      - **Choose training mode**: Select between Fully automated mode (automatic training based on Bria's recipes) and Expert mode (for training parameter tweaking).
      - **Monitor and Control**: Manage the model lifecycle, including training start/stop, 
        status monitoring, and version control over the training parameters.

    4. **Generation Capabilities**:
      - **Image Generation**: Use `/image/generate/tailored` for text-to-image generation.
      - **Structured Prompting**: Use `/structured_prompt/generate/tailored` to create structured prompts via VLM before generation.
      - **Video Generation**: Use `/video/generate/tailored/image-to-video` to animate tailored images.

    ### **Training Process**


    To train a tailored model:


    1. **Create a Project**: Use the `/projects` endpoint to define your IP type
    and medium.

    2. **Create a Dataset**: Use the `/datasets` endpoint to create a dataset
    within your project.

    3. **Define Visual Identity**:
       - **Step A (Generate):** Call `/tailored-gen/generate_visual_schema`, sampling 5-10 images from your input set.
       - **Step B (Refine - Optional):** Call `/tailored-gen/refine_structured_prompt` with the generated schema and instructions to tweak the definitions (e.g., "Remove references to blue background").
       - **Step C (Apply):** Update the dataset with the final schema using `/datasets/{dataset_id}`.
    4. **Upload Images**: Upload images using the
    `/datasets/{dataset_id}/images` or `/datasets/{dataset_id}/images/bulk`
    endpoints 
      (minimum resolution: 1024x1024px). note: if you upload images before updating the visual schema, use the Regenerate All Captions endpoint to caption the images.
    5. **Prepare Dataset**: Review auto-generated captions (you can also use
    `refine_structured_prompt` to fix specific image captions) and update the
    dataset status to 'completed'.

    6. **Create Model**: Use the `/models` endpoint to create a model, which
    requires a training mode.

    7. **Start Training**: Initiate training via the
    `/models/{id}/start_training` endpoint. 
      Training typically takes 4-6 hours.
    8. **Monitor Progress**: Check the training status using the `/models/{id}`
    endpoint until 
      training is 'Completed'.
    9. **Generate Images**: 
      - Use `v2/image/generate/tailored` for text-to-image generation.
tags:
  - name: Project
    description: Manage your projects
  - name: Dataset
    description: Manage training datasets
  - name: Model
    description: Manage and train models
  - name: Image Generation
    description: Generate images using tailored models
  - name: Video Generation
    description: Image-to-Video capabilities
x-tagGroups:
  - name: Training Endpoints
    tags:
      - Project
      - Dataset
      - Model
  - name: Generation Endpoints
    tags:
      - Image Generation
      - Video Generation
externalDocs:
  description: Register and get API Access
  url: https://platform.bria.ai/organization-management/api-keys
servers:
  - url: https://engine.prod.bria-api.com/v2/
paths:
  /image/generate/tailored:
    post:
      summary: Generate Image - Tailored Model
      tags:
        - Image Generation
      servers:
        - url: https://engine.prod.bria-api.com/v2
      description: >
        **Description**


        Generates a new image using a tailored model.


        This endpoint translates your input (`prompt` and/or
        `structured_prompt`) into a structured JSON prompt using the
        state-of-the-art **Gemini 2.5 Flash** VLM bridge. It internally uses the
        model's visual schema (backbone) to ensure the generated image matches
        your trained visual identity.


        The response includes both the final `image_url` and the
        `structured_prompt` (JSON).


        **Input Combination Rules**

        The request body must include **one** of the following mutually
        exclusive combinations:

        * `prompt`: Generates a new image from text.

        * `structured_prompt`: Recreates a previous image exactly (requires
        seed).

        * `structured_prompt` + `prompt`: Refines a previous image using new
        text instructions.
      operationId: image-generate-tailored
      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - tailored_model_id
              properties:
                tailored_model_id:
                  type: string
                  description: The ID of the tailored model.
                tailored_model_influence:
                  type: number
                  format: float
                  description: >-
                    Controls the strength of the tailored model's influence (0.0
                    - 1.5).
                  default: 1
                  minimum: 0
                  maximum: 1.5
                prompt:
                  type: string
                  description: Text-based instruction for generation or refinement.
                structured_prompt:
                  type: string
                  description: >-
                    A string containing the structured prompt in JSON format for
                    precise recreation/refinement.
                negative_prompt:
                  type: string
                  description: Concepts to exclude from the generated image.
                guidance_scale:
                  type: integer
                  description: Adherence to the prompt (3-5).
                  default: 5
                  minimum: 3
                  maximum: 5
                aspect_ratio:
                  type: string
                  default: '1:1'
                  enum:
                    - '1:1'
                    - '2:3'
                    - '3:2'
                    - '3:4'
                    - '4:3'
                    - '4:5'
                    - '5:4'
                    - '9:16'
                    - '16:9'
                steps_num:
                  type: integer
                  default: 50
                  minimum: 20
                  maximum: 50
                seed:
                  type: integer
                  description: Seed for deterministic generation.
                sync:
                  type: boolean
                  default: false
                  description: >-
                    If false, returns a 202 and status URL. If true, returns 200
                    with result.
                prompt_content_moderation:
                  type: boolean
                  default: true
                visual_output_content_moderation:
                  type: boolean
                  default: true
            examples:
              New Generation:
                value:
                  tailored_model_id: model_123
                  prompt: A product photo in the brand's visual style
      responses:
        '200':
          description: Successful operation (Synchronous).
          content:
            application/json:
              schema:
                type: object
                properties:
                  image_url:
                    type: string
                  structured_prompt:
                    type: string
        '202':
          description: Accepted (Asynchronous).
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  status_url:
                    type: string
        '400':
          description: Bad request. Invalid parameters.
        '403':
          description: Forbidden. Model does not belong to organization.
        '422':
          description: Unprocessable Entity (Moderation failure).
        '429':
          description: Request limit exceeded.
        '500':
          description: Internal Server Error.
  /structured_prompt/generate/tailored:
    post:
      summary: Generate Structured Prompt - Tailored Model
      tags:
        - Image Generation
      servers:
        - url: https://engine.prod.bria-api.com/v2
      description: >
        **Description**


        Creates a new detailed, machine-readable structured prompt in JSON
        format or refines an existing one using text inputs and a tailored
        model's visual schema (backbone).


        This endpoint uses the state-of-the-art **Gemini 2.5 Flash** VLM bridge.
        The tailored model's visual schema is provided as input to Gemini along
        with the user prompt to generate the structured prompt.


        **It returns ONLY the JSON string and does not generate an image.**


        **Use Cases:**

        * **Control & Auditability:** Inspect or programmatically edit the JSON
        *before* generating an image.

        * **Consistency:** Generate one `structured_prompt` and pass it to
        `/image/generate/tailored` multiple times.

        * **Hybrid Deployment:** Use Bria's VLM bridge via API while hosting the
        FIBO image model on a private cloud.


        **Input Combination Rules**

        The request body must use exactly one of the following combinations:

        * **Text Only**: `prompt`

        * **Structured Prompt and Text**: `structured_prompt` and `prompt`
        (Refinement)
      operationId: structured-prompt-generate-tailored
      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - tailored_model_id
              properties:
                tailored_model_id:
                  type: string
                  description: The ID of the tailored model.
                prompt:
                  type: string
                  description: Text-based instruction.
                structured_prompt:
                  type: string
                  description: JSON string from a previous response for refinement.
                seed:
                  type: integer
                  description: Seed for deterministic generation.
                sync:
                  type: boolean
                  default: false
                  description: If false, returns 202. If true, returns 200.
                prompt_content_moderation:
                  type: boolean
                  default: true
            examples:
              Text Only:
                value:
                  tailored_model_id: model_123
                  prompt: A product photo in the brand's visual style
              Refinement:
                value:
                  tailored_model_id: model_123
                  structured_prompt: '{"main_subject": ...}'
                  prompt: add dramatic lighting
      responses:
        '200':
          description: Successful operation (Synchronous).
          content:
            application/json:
              schema:
                type: object
                properties:
                  structured_prompt:
                    type: string
                    description: The generated structured prompt JSON string.
        '202':
          description: Accepted (Asynchronous).
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                  status_url:
                    type: string
        '400':
          description: Bad request. Invalid parameters.
        '403':
          description: Forbidden. Model does not belong to organization.
        '422':
          description: Unprocessable Entity (Moderation failure).
        '429':
          description: Request limit exceeded.
        '500':
          description: Internal Server Error.
  /video/generate/tailored/image-to-video:
    post:
      summary: Generate Video from Tailored Image (Beta)
      description: >
        (Beta)

        Initiates an asynchronous job to generate a 5-second MP4 video file
        animating a source image created by a tailored model.


        **Asynchronous Requests and the Status Service** Bria API endpoints
        process requests asynchronously by default. When you make an
        asynchronous request, the API immediately returns a `request_id` and a
        `status_url` instead of the final result. Use the Status Service to
        track the request's progress until it reaches a completed state.  


        See the full guide at [Status Service
        Documentation](https://docs.bria.ai/status) for complete details and
        usage examples.


        On successful initiation, this endpoint returns a 202 Accepted response.
        Poll the `status_url` or use the Status Service with the `request_id` to
        check for job completion.

        Once 'Completed', the status response will contain the URL to the
        generated MP4 video.
      tags:
        - Video Generation
      servers:
        - url: https://engine.prod.bria-api.com/v2
      operationId: generate-video-from-tailored-image
      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
          description: Your API token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tailored_model_id:
                  type: string
                  description: The ID of the tailored model that generated the input image.
                image:
                  type: string
                  description: >-
                    Publicly accessible URL or base64 string of the source
                    image.
                seed:
                  type: integer
                  description: Optional seed for reproducible results.
              required:
                - tailored_model_id
                - image
            example:
              tailored_model_id: your_tailored_model_id
              image: https://example.com/image.png
              seed: 42
      responses:
        '202':
          description: >-
            Accepted. The video generation job was successfully initiated. You
            can track the progress and retrieve the final result using the
            Status Service. For more details, refer to the [Status
            Service](https://docs.bria.ai/status) section.
          content:
            application/json:
              schema:
                type: object
                properties:
                  request_id:
                    type: string
                    description: The unique identifier for this asynchronous request.
                  status_url:
                    type: string
                    format: uri
                    description: The URL to poll for the status of the generation job.
        '400':
          description: Bad Request. Invalid request body.
        '401':
          description: Unauthorized. The api_token is missing or invalid.
        '403':
          description: Forbidden.
        '404':
          description: Not Found. The specified tailored_model_id does not exist.
        '415':
          description: Unsupported Media Type.
        '422':
          description: Unprocessable Entity. Invalid image data.
        '429':
          description: Too Many Requests. Rate limit exceeded.
        '500':
          description: Internal Server Error.
  /tailored-gen/projects:
    post:
      summary: Create Project
      tags:
        - Project
      servers:
        - url: https://engine.prod.bria-api.com/v1
      description: >
        Create a new project within the organization.


        The following IP types are supported:


        **Defined Character**

        A specific character that maintains consistent identity and unique
        traits while being reproduced in different poses, situations, and
        actions.


        Medium: Photography


        <img
        src="https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/tailored_gen/photogrpahy_dog.png"
        alt="Example of defined character in different poses, photography
        medium" />


        Medium: Illustration


        <img
        src="https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/tailored_gen/defined_character.png"
        alt="Example of defined character in different poses, illustrative
        medium" />


        **Stylized Scene**

        Complete environments or scenes created with a consistent visual style,
        look, and feel.


        Medium: Photography


        <img
        src="https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/tailored_gen/photogrpahy_scene.png"
        alt="Example of stylized scene, photography medium" />


        Medium: Illustration


        <img
        src="https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/tailored_gen/stylized_scene.png"
        alt="Example of stylized scene, illustrative medium" />


        **Multi-Object Set**

        A collection of different objects sharing a common style, design
        language, or color scheme. Objects are typically isolated on solid
        backgrounds.

        <img
        src="https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/tailored_gen/multi_object_set.png"
        alt="Example of multi-object set" />


        **Object Variants**

        Multiple variations of the same object type, maintaining consistent
        style and structure while showing different interpretations. Objects are
        typically isolated on solid backgrounds.

        <img
        src="https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/tailored_gen/object_variants.png"
        alt="Example of object variants" />


        **Icons**

        A collection of cohesive, small-scale illustrations or symbols designed
        to represent concepts, actions, or objects in interfaces and
        applications.

        <img
        src="https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/tailored_gen/icons.png"
        alt="Example of icon set" />


        **Character Variants**

        Multiple characters sharing the same fundamental structure, style, and
        color palette, allowing creation of new characters that fit within the
        established design system.

        <img
        src="https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/tailored_gen/character_variants.png"
        alt="Example of character variants" />
      operationId: create-project
      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                project_name:
                  type: string
                  description: Name of the project (required)
                project_description:
                  type: string
                  description: Description of the project (optional)
                ip_name:
                  type: string
                  description: >-
                    Required only for defined_character IP type. The name of the
                    character (1-3 words, e.g., "Lora", "Captain Smith").
                ip_description:
                  type: string
                  description: >-
                    Required only for defined_character and object_variants IP
                    types. A short phrase (up to 6 words) describing the most
                    crucial distinguishing features (e.g., "a female character
                    with purple hair").
                ip_medium:
                  type: string
                  enum:
                    - photography
                    - illustration
                  description: Medium of the IP (required)
                ip_type:
                  type: string
                  enum:
                    - multi_object_set
                    - object_variants
                    - icons
                    - defined_character
                    - character_variants
                    - stylized_scene
                    - other
                  description: >
                    Type of the IP (required):

                    * defined_character: A specific predefined character or
                    person that can be reproduced consistently.

                    * stylized_scene: A complete scene or environment with a
                    cohesive style.

                    * other: For IP types that don't fit into any of the types.


                    The types below are currently available only when ip_medium
                    = illustration:

                    * object_variants: Variations of the same object type with
                    consistent style.

                    * multi_object_set: Multiple distinct objects sharing a
                    mutual style.

                    * icons: A collection of small, visually distinct
                    illustrations or symbols.

                    * character_variants: Multiple characters sharing the same
                    structure, style, and color palette.
            example:
              project_name: Branded Character
              ip_name: Adventure Series Characters
              ip_description: A set of adventure game characters with unique personalities
              ip_medium: illustration
              ip_type: defined_character
      responses:
        '201':
          description: Project successfully created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique identifier for the project
                  project_name:
                    type: string
                    description: Name of the project
                  project_description:
                    type: string
                    description: Description of the project
                  ip_name:
                    type: string
                    description: Name of the IP
                  ip_description:
                    type: string
                    description: Description of the IP
                  ip_medium:
                    type: string
                    description: Medium of the IP
                  ip_type:
                    type: string
                    description: Type of the IP
                  training_version:
                    type: string
                    nullable: true
                    description: >-
                      The training version family this project is locked to
                      (e.g., 'fibo', 'max', or null if unlocked).
                  status:
                    type: string
                    enum:
                      - active
                    description: Status of the project
                  created_at:
                    type: string
                    format: date-time
                    description: Timestamp when the project was created
              example:
                id: 123
                project_name: Branded Character
                project_description: ''
                ip_name: Lora
                ip_description: A female character with purple hair
                ip_medium: illustration
                ip_type: defined_character
                status: active
                created_at: '2024-05-26T12:00:00Z'
        '400':
          description: Bad request - validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: string
              examples:
                quota_exceeded:
                  value: >-
                    Quota exceeded: Free users can make up to 1000 requests in
                    total. Please upgrade your plan to continue using the
                    service.
                access_denied:
                  value: >-
                    Access denied: Your subscription does not include access to
                    this feature/product.
        '429':
          description: >-
            Request limit exceeded. Your account has reached its maximum allowed
            requests. Please upgrade your plan or try again later.
        '500':
          description: Internal server error
    get:
      summary: Get Projects
      tags:
        - Project
      servers:
        - url: https://engine.prod.bria-api.com/v1
      description: >-
        Retrieve all projects within the organization. If there are no projects,
        returns an empty array.
      operationId: get-projects
      parameters:
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successfully retrieved projects
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    project_name:
                      type: string
                    project_description:
                      type: string
                    ip_name:
                      type: string
                    ip_description:
                      type: string
                    ip_medium:
                      type: string
                      enum:
                        - photography
                        - illustration
                    ip_type:
                      type: string
                      enum:
                        - multi_object_set
                        - object_variants
                        - icons
                        - defined_character
                        - character_variants
                        - stylized_scene
                        - other
                    status:
                      type: string
                      enum:
                        - active
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
              example:
                - id: 123
                  project_name: Branded Character
                  project_description: ''
                  ip_name: Lora
                  ip_description: A female character with purple hair
                  ip_medium: illustration
                  ip_type: defined_character
                  status: active
                  created_at: '2024-05-26T12:00:00Z'
                  updated_at: '2024-05-26T14:30:00Z'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '429':
          description: Request limit exceeded.
        '500':
          description: Internal server error
  /tailored-gen/projects/{project_id}:
    get:
      summary: Get Project by ID
      tags:
        - Project
      servers:
        - url: https://engine.prod.bria-api.com/v1
      description: Retrieve full project information.
      operationId: get-project-by-id
      parameters:
        - in: path
          name: project_id
          schema:
            type: string
          required: true
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successfully retrieved project
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  project_name:
                    type: string
                  project_description:
                    type: string
                  ip_name:
                    type: string
                  ip_description:
                    type: string
                  ip_medium:
                    type: string
                    enum:
                      - photography
                      - illustration
                  ip_type:
                    type: string
                    enum:
                      - multi_object_set
                      - object_variants
                      - icons
                      - defined_character
                      - character_variants
                      - stylized_scene
                      - other
                  status:
                    type: string
                    enum:
                      - active
                  created_at:
                    type: string
                    format: date-time
              example:
                id: 123
                project_name: Branded Character
                project_description: ''
                ip_name: Lora
                ip_description: A female character with purple hair
                ip_medium: illustration
                ip_type: defined_character
                status: active
                created_at: '2024-05-26T12:00:00Z'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
        '429':
          description: Request limit exceeded.
        '500':
          description: Internal server error
    put:
      summary: Update Project
      tags:
        - Project
      servers:
        - url: https://engine.prod.bria-api.com/v1
      description: Update a specific project.
      operationId: update-project
      parameters:
        - in: path
          name: project_id
          schema:
            type: string
          required: true
        - in: header
          name: api_token
          schema:
            type: string
          required: true
