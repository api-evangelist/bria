    description: >
      Permanently delete a specific model checkpoint. Deletion is not allowed if
      the checkpoint is currently selected for inference.
    operationId: delete-checkpoint
    parameters:
      - in: path
        name: model_id
        required: true
        schema:
          type: integer
        description: The ID of the model.
      - in: path
        name: checkpoint_step
        required: true
        schema:
          type: integer
        description: The training step number of the checkpoint to delete.
      - in: header
        name: api_token
        required: true
        schema:
          type: string
    responses:
      '204':
        description: Checkpoint successfully deleted.
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              type: string
            example: Cannot delete checkpoint currently selected for inference
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              type: string
            example: Checkpoint not found
/tailored-gen/models/{model_id}/download:
  get:
    summary: Download Tailored Model
    tags:
      - Model
    servers:
      - url: https://engine.prod.bria-api.com/v1
    description: >
      Download a trained tailored generation model after completing the training
      process.

      The response includes a pre-signed URL for downloading the model and
      details about the base model used.


      To use the tailored model source code, access to the base model source
      code is required.

      The base model source code is exclusively available through Bria's
      **Source Code and Weights** product.

      For more information or to gain access, contact us at **info@bria.ai**.
    operationId: download-tailored-model
    parameters:
      - in: path
        name: model_id
        required: true
        schema:
          type: string
        description: The unique identifier of the tailored model.
      - in: header
        name: api_token
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Successful retrieval of the tailored model download details.
        content:
          application/json:
            schema:
              type: object
              properties:
                download_url:
                  type: string
                  description: >-
                    A pre-signed URL allowing users to download the tailored
                    model.
                base_model_name:
                  type: string
                  description: The name of the base model used for training.
                base_model_card:
                  type: string
                  description: >-
                    URL to the Hugging Face model card of the respective base
                    model.
            example:
              download_url: https://download-url-for-tailored-model.com
              base_model_name: BRIA-FIBO
              base_model_card: https://huggingface.co/briaai/BRIA-FIBO
      '400':
        description: Bad request. The request is malformed.
      '401':
        description: Unauthorized. Invalid or missing API token.
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              type: string
            examples:
              quota_exceeded:
                value: >-
                  Quota exceeded: Free users can make up to 1000 requests in
                  total. Please upgrade your plan to continue using the service.
              access_denied:
                value: >-
                  Access denied: Your subscription does not include access to
                  this feature/product.
      '404':
        description: Not found. The requested model_id does not exist.
      '500':
        description: Internal server error.
