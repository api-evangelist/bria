  /tailored-gen/datasets/{dataset_id}/images:
    post:
      summary: Upload Image Files
      tags:
        - Dataset
      servers:
        - url: https://engine.prod.bria-api.com/v1
      description: >
        Upload a new image to a dataset.


        **Image Requirements:**

        - Recommended minimum resolution: 1024x1024 pixels for best quality
          - By default, smaller images (down to 256x256) will be automatically upscaled (`increase_resolution=true`)
          - To strictly enforce the 1024x1024 minimum, set `increase_resolution=false`
        - Supported formats: jpg, jpeg, png, webp

        - Preferably use original high-quality assets


        **Dataset Guidelines:**

        - Recommended: 5-50 images for optimal results

        - Maximum supported: 200 images

        - Ensure consistency in style, structure, and visual elements

        - Balance diversity in content while maintaining consistency in key
        elements


        **For optimal training (especially for characters/objects):**

        - Subject should occupy most of the image area

        - Minimize unnecessary margins around the subject

        - Transparent backgrounds will be converted to black

        - For character datasets: include diverse poses, environments, attires,
        and interactions


        **Constraints:**

        - Can only be used by "basic" upload type datasets. Use images/bulk for
        advanced datasets.

        - Dataset must have at least 5 images

        - Dataset cannot exceed 200 images

        - Cannot upload to a completed dataset


        This API endpoint supports content moderation via an optional parameter.
      operationId: upload-image
      parameters:
        - in: path
          name: dataset_id
          schema:
            type: integer
          required: true
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Image file to upload (required if image_url not provided)
                image_url:
                  type: string
                  description: URL of image to upload (required if file not provided)
                image_name:
                  type: string
                  description: Custom name for the image (optional)
                increase_resolution:
                  type: boolean
                  default: true
                  description: >
                    When enabled (default), input images smaller than 1024x1024
                    but larger than 256x256 will be automatically upscaled.

                    If false, images must be at least 1024x1024 pixels.
                content_moderation:
                  type: boolean
                  default: false
            example:
              image_url: https://example.com/images/character_pose.jpg
              image_name: character_standing_pose.jpg
      responses:
        '201':
          description: Image successfully uploaded
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  dataset_id:
                    type: integer
                  caption:
                    type: string
                    nullable: true
                    description: >-
                      The generated caption. Null if uploaded without a visual
                      schema.
                  caption_source:
                    type: string
                    nullable: true
                    enum:
                      - automatic
                      - manual
                      - pending
                  image_name:
                    type: string
                  image_url:
                    type: string
                  thumbnail_url:
                    type: string
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
        '400':
          description: Bad request
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Dataset not found
        '409':
          description: Conflict error (completed dataset or max images reached)
        '412':
          description: Precondition Failed (resolution too low)
        '415':
          description: Unsupported Media Type.
        '422':
          description: Unprocessable Entity (moderation failure or invalid URL)
        '429':
          description: Request limit exceeded.
        '500':
          description: Internal server error
    get:
      summary: Get Images
      tags:
        - Dataset
      servers:
        - url: https://engine.prod.bria-api.com/v1
      description: Retrieve all images in a specific dataset.
      operationId: get-images
      parameters:
        - in: path
          name: dataset_id
          schema:
            type: integer
          required: true
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Successfully retrieved images
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    dataset_id:
                      type: integer
                    caption:
                      type: string
                    caption_source:
                      type: string
                      enum:
                        - automatic
                        - manual
                    image_name:
                      type: string
                    image_url:
                      type: string
                    thumbnail_url:
                      type: string
                    created_at:
                      type: string
                      format: date-time
                    updated_at:
                      type: string
                      format: date-time
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Dataset not found
        '429':
          description: Request limit exceeded.
        '500':
          description: Internal server error
    put:
      summary: Regenerate All Captions
      tags:
        - Dataset
      servers:
        - url: https://engine.prod.bria-api.com/v1
      description: >
        Regenerate captions for all images in a dataset. This is crucial after
        updating the visual schema, to ensure full compatibility with the new
        schema.


        This is an asynchronous operation. Once called, poll Get Dataset by ID
        until `captions_update_status` changes to 'completed'.
      operationId: regenerate-all-captions
      parameters:
        - in: path
          name: dataset_id
          schema:
            type: integer
          required: true
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      responses:
        '202':
          description: Caption regeneration process started
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  project_id:
                    type: integer
                  name:
                    type: string
                  visual_schema:
                    type: string
                    nullable: true
                  status:
                    type: string
                    enum:
                      - draft
                      - completed
                  captions_update_status:
                    type: string
                    enum:
                      - empty
                      - in_progress
                      - completed
                  created_at:
                    type: string
                    format: date-time
                  updated_at:
                    type: string
                    format: date-time
              example:
                id: 456
                project_id: 123
                name: dataset v1
                visual_schema: '{"style": "..."}'
                status: draft
                captions_update_status: in_progress
                created_at: '2024-05-26T12:00:00Z'
                updated_at: '2024-05-26T15:45:00Z'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Dataset not found
        '429':
          description: Request limit exceeded.
        '500':
          description: Internal server error
  /tailored-gen/datasets/{dataset_id}/images/bulk-upload:
    post:
      summary: Advanced Image Upload
      tags:
        - Dataset
      servers:
        - url: https://engine.prod.bria-api.com/v1
      description: >
        Efficiently upload a large volume of images (up to 5000) from a ZIP file
        to an advanced dataset.


        **Upload without Schema:** You can initiate a bulk upload even if
        `visual_schema` is null. Images will be uploaded but caption generation
        will be skipped. You must call **Regenerate All Captions** after
        defining the schema.


        **General:**

        * Asynchronous operation; status can be retrieved via
        `{dataset_id}/bulk-upload/status`.

        * Supported for 'advanced' upload type datasets only.

        * If the dataset is not empty, if another bulk upload is in progress, or
        if any previous bulk upload attempt took place, the request will fail.


        **Image Requirements:**

        * Supported formats: `jpg`, `jpeg`, `png`, `webp`.

        * Minimum dimensions: 1024 x 1024 pixels.

        * Total size limit: 5 GB zip file.
      operationId: bulk-upload-images
      parameters:
        - in: path
          name: dataset_id
          required: true
          schema:
            type: integer
        - in: header
          name: api_token
          required: true
          schema:
