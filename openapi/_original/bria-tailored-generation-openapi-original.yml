          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Model not found
        '409':
          description: Training already started/cannot be resumed
        '412':
          description: Dataset status must be 'completed' to start training
        '429':
          description: Request limit exceeded.
        '500':
          description: Internal server error
  /tailored-gen/models/{model_id}/stop_training:
    post:
      summary: Stop Training
      tags:
        - Model
      servers:
        - url: https://engine.prod.bria-api.com/v1
      description: >-
        Stop an ongoing model training process. Once stopped, training cannot be
        resumed - a new model would need to be created and trained.
      operationId: stop-training
      parameters:
        - in: path
          name: model_id
          required: true
          schema:
            type: integer
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      responses:
        '200':
          description: Training job successfully stopped
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Model not found
        '409':
          description: Training already stopped/not in training
        '429':
          description: Request limit exceeded.
        '500':
          description: Internal server error
  /tailored-gen/models/{model_id}/checkpoints:
    get:
      summary: List Checkpoints
      tags:
        - Model
      servers:
        - url: https://engine.prod.bria-api.com/v1
      description: >-
        Retrieve a list of all available checkpoints for a model. Only available
        for models trained in `expert` mode.
      operationId: list-checkpoints
      parameters:
        - in: path
          name: model_id
          required: true
          schema:
            type: integer
        - in: header
          name: api_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully retrieved list of checkpoints.
          content:
            application/json:
              schema:
                type: object
                properties:
                  checkpoints:
                    type: array
                    items:
                      type: object
                      properties:
                        checkpoint_step:
                          type: integer
                        training_job_id:
                          type: integer
                        created_at:
                          type: string
                          format: date-time
                  active_model_version:
                    type: string
        '400':
          description: Bad Request
        '404':
          description: Not Found
  /tailored-gen/models/{model_id}/checkpoints/{checkpoint_step}:
    get:
      summary: Get Specific Checkpoint
      tags:
        - Model
      servers:
        - url: https://engine.prod.bria-api.com/v1
      description: Retrieve details for a specific model checkpoint.
      operationId: get-checkpoint
      parameters:
        - in: path
          name: model_id
          required: true
          schema:
            type: integer
        - in: path
          name: checkpoint_step
          required: true
          schema:
            type: integer
        - in: header
          name: api_token
          required: true
          schema:
            type: string
      responses:
