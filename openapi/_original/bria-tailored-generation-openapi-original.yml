        description: Model ID
      - in: header
        name: api_token
        schema:
          type: string
        required: true
    responses:
      '200':
        description: Training job successfully stopped
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              type: string
            examples:
              quota_exceeded:
                value: >-
                  Quota exceeded: Free users can make up to 1000 requests in
                  total. Please upgrade your plan to continue using the service.
              access_denied:
                value: >-
                  Access denied: Your subscription does not include access to
                  this feature/product.
      '404':
        description: Model not found
      '409':
        description: Training already stopped/not in training
      '429':
        description: >-
          Request limit exceeded. Your account has reached its maximum allowed
          requests. Please upgrade your plan or try again later.
      '500':
        description: Internal server error
/tailored-gen/models/{model_id}/checkpoints:
  get:
    summary: List Checkpoints
    tags:
      - Model
    servers:
      - url: https://engine.prod.bria-api.com/v1
    description: >
      Retrieve a list of all available checkpoints for a model. This is only
      available for models trained in `expert` mode.
    operationId: list-checkpoints
    parameters:
      - in: path
        name: model_id
        required: true
        schema:
          type: integer
        description: The ID of the model to list checkpoints for.
      - in: header
        name: api_token
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Successfully retrieved list of checkpoints.
        content:
          application/json:
            schema:
              type: object
              properties:
                checkpoints:
                  type: array
                  items:
                    type: object
                    properties:
                      checkpoint_step:
                        type: integer
                        description: The training step at which the checkpoint was saved.
                      training_job_id:
                        type: integer
                        description: >-
                          The ID of the training job associated with the
                          checkpoint.
                      created_at:
                        type: string
                        format: date-time
                        description: Timestamp of checkpoint creation.
                  description: A list of all available checkpoints for the model.
                active_model_version:
                  type: string
                  description: >-
                    The training step number of the checkpoint currently
                    selected for inference.
            example:
              checkpoints:
                - checkpoint_step: 100
                  training_job_id: 12242
                  created_at: '2025-08-20T10:04:13.827379'
              active_model_version: '100'
      '400':
        description: Bad Request
        content:
          application/json:
            schema:
              type: string
            example: The model status is not completed
      '404':
        description: Not Found
        content:
          application/json:
            schema:
              type: string
            example: Model not found
/tailored-gen/models/{model_id}/checkpoints/{checkpoint_step}:
  get:
