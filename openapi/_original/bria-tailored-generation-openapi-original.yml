        schema:
          type: integer
        description: The ID of the model.
      - in: path
        name: checkpoint_step
        required: true
        schema:
          type: integer
        description: The training step number of the checkpoint.
      - in: header
        name: api_token
        required: true
        schema:
          type: string
    responses:
      '200':
        description: Successfully retrieved checkpoint details.
        content:
          application/json:
            schema:
              type: object
              properties:
                checkpoint_step:
                  type: integer
                  description: The training step number of the checkpoint.
                training_job_id:
                  type: integer
                  description: The ID of the training job.
                created_at:
                  type: string
                  format: date-time
                  description: Timestamp of checkpoint creation.
