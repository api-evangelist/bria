        '500':
          description: Internal server error.
/tailored-gen/models:
  post:
    summary: Create Model
    tags:
      - Model
    servers:
      - url: https://engine.prod.bria-api.com/v1
    description: Create a new model linked to a completed dataset.
    operationId: create-model
    parameters:
      - in: header
        name: api_token
        schema:
          type: string
        required: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              name:
                type: string
                description: Name of the model (required)
              dataset_id:
                type: integer
                description: ID of the dataset to use (required)
              training_mode:
                type: string
                enum:
                  - fully_automated
                  - expert
                default: fully_automated
                description: >
                  Defines the training configuration strategy.

                  * `fully_automated`: Get good results without the guesswork.
                  Automatically configures the training recipe based on dataset
                  size and IP medium/type.

                  * `expert`: Designed for experienced users needing control
                  over training parameters and support for larger datasets.
              description:
                type: string
                description: Description of the model (optional)
          example:
            name: Lora Character Model
            dataset_id: 456
            training_mode: fully_automated
            description: A model trained on Lora character illustrations
    responses:
      '201':
        description: Model successfully created
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: Unique identifier for the model
                name:
                  type: string
                  description: Name of the model
                description:
                  type: string
                  description: Description of the model
                status:
                  type: string
                  description: Status of the model
                  enum:
                    - Created
                training_mode:
                  type: string
                  description: Training configuration strategy
                  enum:
                    - fully_automated
                    - expert
                project_id:
                  type: integer
                  description: ID of the project this model belongs to
                dataset_id:
                  type: integer
                  description: ID of the dataset used for training
                created_at:
                  type: string
                  format: date-time
                  description: Timestamp when the model was created
                updated_at:
                  type: string
                  format: date-time
                  description: Timestamp when the model was last updated
                custom_metadata:
                  type: string
                  description: Custom metadata associated with the model
                active_model_version:
                  type: string
                  description: >-
                    The active version (checkpoint) of the model. Becomes
                    relevant after training has completed.
                training_parameters:
                  type: object
                  description: >-
                    The training parameters used for the model. Populated via
                    the /start_training endpoint.
                checkpoint_steps:
                  type: array
                  items:
                    type: string
                  description: >-
                    A list of checkpoints saved for the model. Populated via the
                    /start_training endpoint.
            example:
              id: 12233
              name: Test Model
              description: Test description
              status: Created
              dataset_id: 13748
              training_mode: expert
              project_id: 12429
              created_at: '2025-08-20T06:06:05.849402'
              updated_at: '2025-08-20T06:06:05.849404'
              custom_metadata: ''
              active_model_version: default
              training_parameters: {}
              checkpoint_steps: []
      '400':
        description: Bad request - validation error
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              type: string
            examples:
              quota_exceeded:
                value: >-
                  Quota exceeded: Free users can make up to 1000 requests in
                  total. Please upgrade your plan to continue using the service.
              access_denied:
                value: >-
                  Access denied: Your subscription does not include access to
                  this feature/product.
      '404':
        description: Dataset not found
      '429':
        description: >-
          Request limit exceeded. Your account has reached its maximum allowed
          requests. Please upgrade your plan or try again later.
      '500':
        description: Internal server error
  get:
    summary: Get Models
    tags:
      - Model
    servers:
      - url: https://engine.prod.bria-api.com/v1
    description: >-
      Retrieve a list of models. If there are no models, an empty array is
      returned.
    operationId: get-models
    parameters:
      - in: header
        name: api_token
        schema:
          type: string
        required: true
      - in: query
        name: include_training_parameters
        required: false
        schema:
          type: boolean
          default: false
        description: >-
