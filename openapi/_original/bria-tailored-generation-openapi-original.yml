/tailored-gen/models/{model_id}/start_training:
  post:
    summary: Start Training
    tags:
      - Model
    servers:
      - url: https://engine.prod.bria-api.com/v1
    description: >
      Start model training. Training duration is typically 2-4 hours.

      The associated dataset must have a status of 'completed' before training
      can begin.


      If parameters are not provided, optimal default values are automatically
      selected based on the dataset.


      **Default Training Parameters:**

      * `rank`: 128

      * `learning_rate`: 0.0001

      * `lr_scheduler`: "constant_with_warmup"

      * `total_training_steps`: 750

      * `checkpoint_interval`: 500


      **Constraints:**

      * Advanced training parameters are only supported when the model's
      `training_mode` is set to 'expert'.
    operationId: start-training
    parameters:
      - in: path
        name: model_id
        required: true
        schema:
          type: integer
        description: Model ID
      - in: header
        name: api_token
        schema:
          type: string
        required: true
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              lr_scheduler:
                type: string
                description: >-
                  The learning rate scheduler used to adjust the learning rate
                  throughout the training process.
                enum:
                  - linear
                  - cosine
                  - cosine_with_restarts
                  - polynomial
                  - constant
                  - constant_with_warmup
                default: constant_with_warmup
              learning_rate:
                type: number
                format: float
                minimum: 0.000001
                maximum: 0.001
                description: The initial learning rate. Default is 0.0001.
              total_training_steps:
                type: integer
                minimum: 1
                maximum: 5000
                description: >-
                  The total number of training optimization steps. Default is
                  750.
              rank:
                type: integer
                minimum: 4
                maximum: 256
                description: The rank (latent dimension). Default is 128.
              checkpoint_interval:
                type: integer
                minimum: 100
                description: >-
                  The interval (in steps) at which model checkpoints are saved.
                  Default is 500.
              lr_warmup_steps:
                type: integer
                minimum: 0
                maximum: 1000
                default: 100
                description: >
                  Number of warmup steps for the learning rate scheduler.

                  Relevant only when `lr_scheduler` is set to
                  `constant_with_warmup`.
    responses:
      '200':
        description: Training successfully started
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  description: Unique identifier for the model.
                name:
                  type: string
                  description: Name of the model.
                description:
                  type: string
                  description: Description of the model.
                status:
                  type: string
                  description: Status of the model.
                  enum:
                    - InProgress
                dataset_id:
                  type: integer
                  description: ID of the dataset used for training.
                training_mode:
                  type: string
                  description: The training mode of the model.
                project_id:
                  type: integer
                  description: ID of the project this model belongs to.
                created_at:
                  type: string
                  format: date-time
                  description: Timestamp when the model was created.
                updated_at:
                  type: string
                  format: date-time
                  description: Timestamp when the model was last updated.
                custom_metadata:
                  type: string
                  description: Custom metadata associated with the model.
                active_model_version:
                  type: string
                  description: The active version of the model.
                training_parameters:
                  type: object
                  description: The training parameters used for the model.
                  properties:
                    learning_rate:
                      type: number
                      format: float
                    lr_scheduler:
                      type: string
                    rank:
                      type: integer
                    total_training_steps:
                      type: integer
                    checkpoint_interval:
                      type: integer
                    lr_warmup_steps:
                      type: integer
                      nullable: true
                      description: >
                        Number of warmup steps. Returns `null` if `lr_scheduler`
                        is NOT `constant_with_warmup`.
                checkpoint_steps:
                  type: array
                  items:
                    type: string
                  description: A list of checkpoint steps for the model.
            example:
              id: 12242
              name: Test Model
              description: Test description
              status: InProgress
              dataset_id: 13749
              training_mode: expert
              project_id: 12429
              created_at: '2025-08-20T09:51:58.080018'
              updated_at: '2025-08-20T09:51:58.080020'
              custom_metadata: ''
              active_model_version: default
              training_parameters:
                learning_rate: 0.0001
                lr_scheduler: constant_with_warmup
                rank: 44
                total_training_steps: 750
                checkpoint_interval: 500
                lr_warmup_steps: 100
              checkpoint_steps: []
      '400':
        description: Bad request - validation error
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  properties:
                    message:
                      type: string
                  example:
                    message: >-
                      Advanced training parameters are only supported when
                      training_mode is set to 'expert'.
                - type: object
                  properties:
                    errors:
                      type: array
                      items:
                        type: object
                        properties:
                          msg:
                            type: string
                          field_name:
                            type: string
                          field_input:
                            type: string
                        required:
                          - msg
                          - field_name
                          - field_input
                  example:
                    errors:
                      - msg: Input should be less than or equal to 5000
                        field_name: total_training_steps
                        field_input: '1000000'
      '401':
        description: Unauthorized
      '403':
        description: Forbidden
        content:
          application/json:
            schema:
              type: string
            examples:
              quota_exceeded:
                value: >-
                  Quota exceeded: Free users can make up to 1000 requests in
                  total. Please upgrade your plan to continue using the service.
              access_denied:
                value: >-
                  Access denied: Your subscription does not include access to
                  this feature/product.
      '404':
        description: Model not found
      '409':
        description: Training already started/cannot be resumed
      '412':
        description: Dataset status must be 'completed' to start training
      '429':
        description: >-
          Request limit exceeded. Your account has reached its maximum allowed
          requests. Please upgrade your plan or try again later.
      '500':
        description: Internal server error
/tailored-gen/models/{model_id}/stop_training:
  post:
    summary: Stop Training
    tags:
      - Model
    servers:
      - url: https://engine.prod.bria-api.com/v1
    description: >-
      Stop an ongoing model training process. Once stopped, training cannot be
      resumed - a new model would need to be created and trained.
    operationId: stop-training
    parameters:
      - in: path
        name: model_id
