    responses:
      '200':
        description: Successfully retrieved models
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    description: Unique identifier for the model
                  name:
                    type: string
                    description: Name of the model
                  description:
                    type: string
                    description: Description of the model
                  status:
                    type: string
                    description: Status of the model
                    enum:
                      - Created
                      - InProgress
                      - Completed
                      - Failed
                      - Stopping
                      - Stopped
                  training_mode:
                    type: string
                    description: Training configuration strategy
                    enum:
                      - fully_automated
                      - expert
                  active_model_version:
                    type: string
                    description: The active version (checkpoint) of the model
                  training_parameters:
                    type: object
                    description: The training parameters used for the model.
                    properties:
                      learning_rate:
                        type: number
                        format: float
                      lr_scheduler:
                        type: string
                      rank:
                        type: integer
