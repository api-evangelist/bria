  /tailored-gen/models/{model_id}/download:
    get:
      summary: Download Tailored Model
      tags:
        - Model
      servers:
        - url: https://engine.prod.bria-api.com/v1
      description: >
        Download a trained tailored generation model after completing the
        training process. 

        The response includes a pre-signed URL for downloading the model and
        details about the base model used.


        To use the tailored model source code, access to the base model source
        code is required. 

        The base model source code is exclusively available through Bria's
        **Source Code and Weights** product. 

        For more information, contact us at **info@bria.ai**.
      operationId: download-tailored-model
      parameters:
        - in: path
          name: model_id
          required: true
          schema:
            type: string
        - in: header
          name: api_token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successful retrieval of the tailored model download details.
          content:
            application/json:
              schema:
                type: object
                properties:
                  download_url:
                    type: string
                    description: A pre-signed URL for downloading the tailored model.
                  base_model_name:
                    type: string
                    description: The name of the base model used for training.
                  base_model_card:
                    type: string
                    description: URL to the Hugging Face model card.
              example:
                download_url: https://download-url-for-tailored-model.com
                base_model_name: BRIA-FIBO
                base_model_card: https://huggingface.co/briaai/BRIA-FIBO
        '400':
          description: Bad request.
        '401':
          description: Unauthorized.
        '403':
          description: Forbidden.
        '404':
          description: Not found.
        '500':
          description: Internal server error.
