                    request_id: '123456'
                completed_image_edit:
                  summary: Completed Request (image editing)
                  value:
                    status: COMPLETED
                    result:
                      image_url: https://example.com/generated_image.png
                    request_id: '123456'
                completed_video:
                  summary: Completed Request (video)
                  value:
                    status: COMPLETED
                    result:
                      video_url: https://example.com/generated_video.mp4
                    request_id: '123456'
                completed_structured_prompt:
                  summary: Completed Structured Prompt Request
                  value:
                    status: COMPLETED
                    result:
                      seed: '123456'
                      structured_prompt: >-
                        {\"short_description\": \"A close-up shot of an elegant
                        ring featuring a prominent, teardrop-shaped red
                        gemstone...\",\"objects\": [...],...}
                    request_id: '123456'
                completed_image_edit_with_seed:
                  summary: Completed Request (image edit, with seed)
                  value:
                    status: COMPLETED
                    result:
                      image_url: https://example.com/generated_image.png
                      seed: '42'
                    request_id: '123456'
                completed_image_edit_with_prompt:
                  summary: Completed Request (image edit, with prompt)
                  value:
                    status: COMPLETED
                    result:
                      image_url: https://example.com/generated_image.png
                      seed: '42'
                      prompt: A fantasy landscape with mountains
                    request_id: '123456'
                completed_image_edit_with_refined_prompt:
                  summary: Completed Request (image edit, with refined prompt)
                  value:
                    status: COMPLETED
                    result:
                      image_url: https://example.com/generated_image.png
                      seed: '42'
                      refined_prompt: High-detail fantasy landscape with dramatic mountains
                    request_id: '123456'
                error:
                  summary: Error Response
                  value:
                    status: ERROR
                    error:
                      code: 500
                      message: Internal Server Error
                      details: Unexpected error occurred.
                    request_id: '123456'
        '404':
          description: |
            The provided `request_id` does not exist or has expired.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - NOT_FOUND
                required:
                  - status
              examples:
                not_found_example:
                  summary: Request ID Not Found
                  value:
                    status: NOT_FOUND
        5XX:
          description: >
            **Internal Server Error** – A critical failure occurred in Bria's
            infrastructure, preventing the Status Service from responding.  

            - This response indicates a service outage or unexpected runtime
            failure.  

            - Check [Bria's Status Page](https://status.bria.ai) for real-time
            updates. 

            - Contact [Support](mailto:support@bria.ai).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internal_error:
                  summary: Service Outage
                  value:
                    error:
                      code: 503
                      message: Service Unavailable
                      details: >-
                        Bria's Status Service is temporarily unavailable. Please
                        try again later.
components:
  schemas:
    ErrorObject:
      type: object
      properties:
        code:
          type: integer
          example: 123
        message:
          type: string
        details:
          type: string
      required:
        - code
        - message
        - details
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
        request_id:
          type: string
      required:
        - error
        - request_id
    StatusSuccessResponse:
      type: object
      properties:
        result:
          oneOf:
            - title: ImageResult
              type: object
              properties:
                image_url:
                  type: string
                seed:
                  type: integer
                  description: >-
                    Deterministic generation seed (returned only for endpoints
                    that support reproducible outputs).
                prompt:
                  type: string
                  description: >-
                    Original prompt sent by the user (returned only if
                    applicable).
                refined_prompt:
                  type: string
                  description: >-
                    Refined version of the input prompt (returned only if
                    applicable and supported by the endpoint).
                structured_prompt:
                  type: string
                  description: >-
                    The detailed JSON structured prompt used for the V2
                    generation (returned only by V2 image generation and
                    structured prompt generation endpoints).
              required:
                - image_url
            - title: VideoResult
              type: object
              properties:
                video_url:
                  type: string
              required:
                - video_url
        status:
          type: string
          enum:
            - COMPLETED
        request_id:
          type: string
      required:
        - result
        - status
        - request_id
    StatusErrorResponse:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            status:
              type: string
              enum:
                - ERROR
                - UNKNOWN
          required:
            - status
