openapi: 3.0.0
info:
  title: Overview
  version: ''
  description: >
    The **Status Service** provides progress tracking for asynchronous requests.
    This functionality is supported exclusively for **V2 endpoints**.


    ### Workflow

    1. Submit a request with `sync=false` (default behavior).

    2. The API returns a `status_url` and a `request_id`.

    3. Continuously poll the `status_url` (or use the `/status/{request_id}`
    endpoint) until the `status` field indicates a terminal state.


    ### Status Values

    - **`IN_PROGRESS`** – The request has been accepted and is currently being
    processed.  
      Continue polling until the status changes to either `COMPLETED` or an error state.

    - **`COMPLETED`** – The request was successfully processed.  
      The response includes either `result.image_url` for images or `result.video_url` for videos, , or structured_prompt (for structured prompt generation)."  
      For some endpoints, additional optional fields (seed, prompt, refined_prompt, structured_prompt) may be included.
    - **`ERROR`** – A processing error occurred in the pipeline.  
      The response includes an `error` object with details about the failure. Polling should be stopped.

    - **`UNKNOWN`** – An unexpected internal error occurred (equivalent to an
    HTTP `500` in asynchronous workflows).  
      This status should not occur under normal circumstances. If it does, contact [Support](mailto:support@bria.ai). and provide the `request_id`.
tags:
  - name: Endpoints
externalDocs:
  description: Register and get API Access
  url: https://platform.bria.ai/organization-management/api-keys
servers:
  - url: https://engine.prod.bria-api.com/v2
paths:
  /status/{request_id}:
    get:
      tags:
        - Endpoints
      servers:
        - url: https://engine.prod.bria-api.com/v2
      summary: Get Request Status
      description: >
        Retrieves the current status of an asynchronous request.

          **Behavior**
        - Under normal operation, this endpoint returns **`200 OK`**, regardless
        of whether the request is in progress, completed, or has failed at the
        job level.  

        - The `status` field in the response (`IN_PROGRESS`, `COMPLETED`,
        `ERROR`, `UNKNOWN`) indicates the state of the job.  

        - When the job fails (status=`ERROR`), details of the failure are
        provided in the `error` object, but the HTTP status remains `200`.

        - When `status=COMPLETED`, `result` includes `image_url` for images or
        `video_url` for videos, or structured_prompt based on the original
        endpoint.


        **Other Possible Responses**

        - **`404 NOT_FOUND`** – Returned when the specified `request_id` does
        not exist or has expired.  

        - **`5XX`** – Returned when the Status Service itself experiences an
        internal error.
          For real-time updates, check [Bria's Status Page](https://status.bria.ai). You can also contact our [Support](mailto:support@bria.ai).

        - When `status=COMPLETED`, `result` may also include:
          - `seed` – Deterministic seed used for generation (if supported by the endpoint).
          - `prompt` – Original prompt provided by the user (if applicable).
          - `refined_prompt` – System-enhanced version of the input prompt (if applicable).
          - `structured_prompt` – The detailed JSON structured prompt used for V2 generation.
      operationId: get_status
      parameters:
        - name: request_id
          in: path
          required: true
          schema:
            type: string
          description: Unique identifier of the request.
        - in: header
          name: api_token
          schema:
            type: string
          required: true
      responses:
        '200':
          description: >-
            The `status` field indicates whether the request completed
            successfully or failed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/StatusSuccessResponse'
                  - $ref: '#/components/schemas/StatusErrorResponse'
              examples:
                completed_image_generation:
                  summary: Completed Image Generation Request
                  value:
                    status: COMPLETED
                    result:
                      image_url: >-
                        https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo/new_year_2026.png
                      seed: '123456'
                      structured_prompt: >-
                        {"short_description": "A photorealistic, high-resolution
                        rendering of balloon lettering spelling out \"HAPPY NEW
                        YEAR 2026\" against a pristine white backdrop. The
                        balloons are meticulously crafted with a metallic,
                        reflective surface, showcasing a vibrant color palette
                        of Pantone Bran, Crocus, and Deja vu blue. The
                        composition is perfectly aligned and balanced,
                        emphasizing the celebratory message with natural, soft
                        lighting that creates subtle, elegant reflections and
                        shadows.","objects": [{"description": "A cluster of
                        individual balloon letters forming the word \"HAPPY\".
                        Each letter is inflated and has a smooth, highly
                        reflective metallic surface, catching and distorting the
                        ambient light. The letters are arranged horizontally,
                        slightly overlapping to create a cohesive
                        word.","location": "top-left to center","relationship":
                        "Part of the main textual display, positioned above 'NEW
