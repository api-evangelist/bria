  /structured_prompt/generate/lite:
    post:
      summary: Generate Structured Prompt - Lite
      tags:
      - Endpoints
      servers:
      - url: https://engine.prod.bria-api.com/v2
      description: 'Creates a new detailed, machine-readable structured prompt in JSON format for the **speed-optimized Fibo Lite Pipeline**.


        This endpoint uses Bria''s standard **FIBO-VLM** bridge (open-source, available on Hugging Face) to generate the prompt. It **only returns the JSON string** and does not generate an image.


        **Why use this endpoint?**


        This endpoint decouples the "intent translation" step from the "image generation" step, giving you maximum flexibility.


        * **It''s Optional:** The same structured prompt generation happens automatically behind the scenes when using `/v2/image/generate/lite`.

        * **Control & Auditability:** Allows for a "human-in-the-loop" to inspect, programmatically edit, or version the JSON *before* generating an image (e.g., for a custom UI).

        * **Consistency & Automation:** Generate one `structured_prompt` and pass it to `/v2/image/generate/lite` multiple times to create consistent, auditable variations.

        * **Local Deployment Support:** This bridge is designed to pair seamlessly with the Fibo Lite text-to-image model. This combination enables **fully local, on-prem deployment** and unlocks Fibo Lite''s **faster inference speeds**. Contact support@bria.ai for more information.


        The resulting `structured_prompt` can be used as input for the `/v2/image/generate/lite` endpoint.


        **Input Combination Rules**


        The request body must use exactly one of the following combinations:

        * **Text Only**: `prompt`

        * **Image Only**: `images`

        * **Image and Text**: `images` and `prompt`

        * **Structured Prompt and Text**: `structured_prompt` and `prompt`


        ---

        ** API Access **


        You can register and access the API Token through Bria''s platform by clicking here.'
      operationId: structured-prompt-generate-lite
      parameters:
      - in: header
        name: api_token
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: 'Text-based instruction. Can be used alone to create a new prompt, or as a refinement command with an `images` or `structured_prompt`.

                    '
                images:
                  type: array
                  items:
                    type: string
                  maxItems: 1
                  description: "Publicly available URL or Base64-encoded image. Currently supports a single image. \nSupported formats: **JPEG**, **JPG**, **PNG**, **WEBP**.\n"
                structured_prompt:
                  type: string
                  description: 'A string containing the structured prompt in JSON format. Use a `structured_prompt` from a previous generation''s response.

                    '
                seed:
                  type: integer
                  description: Seed for deterministic generation. Uses a random seed if omitted. This parameter is optional.
                sync:
                  type: boolean
                  default: false
                  description: 'Response mode. This parameter is optional.

                    * `false` (default): Asynchronous. Returns 202 with a `status_url` to poll.

                    * `true`: Synchronous. Holds the connection and returns 200 with the final result.

                    '
                webhook_url:
                  type: string
                  format: uri
                  description: Optional URL for receiving the result via webhook when the async job completes. See [Webhooks](https://docs.bria.ai/webhooks).
                ip_signal:
                  type: boolean
                  default: false
                  description: If true, returns a warning for potential IP content in the `prompt` parameter. This parameter is optional.
                prompt_content_moderation:
                  type: boolean
                  default: true
                  description: If true, returns 422 on input prompt moderation failure in the `prompt` parameter. This parameter is optional.
                visual_input_content_moderation:
                  type: boolean
                  default: true
                  description: If true, returns 422 on visual input moderation failure. This parameter is optional.
            examples:
              Text Only:
                value:
                  prompt: A photorealistic, high-resolution rendering of balloon lettering spelling out "HAPPY NEW YEAR 2026" against a pristine white backdrop. The balloons are meticulously crafted with a metallic, reflective surface, showcasing a vibrant color palette of Pantone Bran, Crocus, and Deja vu blue. The composition is perfectly aligned and balanced, emphasizing the celebratory message with natural, soft lighting that creates subtle, elegant reflections and shadows.
              Image Only:
                value:
                  images:
                  - https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo/ref_1.jpg
              Image and Text:
                value:
                  prompt: generate a couple in this style
                  images:
                  - https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-lite/ref_1.jpg
              Structured Prompt and Text:
                value:
                  prompt: turn the scene into a daylight scene, with sunlight
                  structured_prompt: '{"aesthetics": {"aesthetic_score": "very high", "color_scheme": "cool blues and silvers from the moonlight contrasting with warm browns and grays of the owl''s feathers, creating a balanced and enchanting palette.", "composition": "centered, portrait composition, with the owl filling a significant portion of the frame.", "mood_atmosphere": "magical, serene, whimsical, and endearing.", "preference_score": "very high"}, "artistic_style": "fantasy, cute, detailed", "background_setting": "A dark, blurred forest at night, with hints of tree trunks and foliage visible. The background is uniformly dark, emphasizing the owl as the central focus. Moonlight subtly illuminates parts of the background, creating a soft, ethereal glow.", "context": "A whimsical character illustration, likely intended for children''s books, animated media, or as a charming decorative art piece.", "lighting": {"conditions": "moonlight", "direction": "top-left, casting subtle highlights", "shadows": "soft, diffused shadows on the right side of the owl and within the background foliage, indicating a gentle light source."}, "objects": [{"action": "Sitting and observing.", "appearance_details": "The eyes are wide, dark, and reflective, conveying a sense of wonder and innocence. The beak is small and light-colored, almost blending with the feathers.", "description": "An adorable, fluffy owl with large, expressive eyes and soft, voluminous feathers. It has a round head, small ear tufts, and a slightly downturned beak. Its plumage is a mix of warm browns, grays, and subtle silver highlights from the moonlight.", "expression": "Curious, innocent, and charming.", "gender": "unknown", "location": "center", "number_of_objects": 1, "orientation": "upright", "pose": "Sitting upright, body facing slightly to the right, head turned to face forward.", "relationship": "The owl is the sole subject, perched comfortably within its environment.", "relative_size": "large within frame", "shape_and_color": "Round head, oval body, predominantly brown and grey with silver highlights.", "texture": "Extremely soft, fluffy, and detailed feathers, giving a plush toy-like appearance."}], "photographic_characteristics": {"camera_angle": "eye-level, as if observing the owl directly.", "depth_of_field": "shallow", "focus": "sharp focus on the owl''s face and eyes, with a soft blur in the background.", "lens_focal_length": "portrait lens (e.g., 50mm-85mm)"}, "short_description": "A hyper-detailed, ultra-fluffy owl sitting in the trees at night, looking directly at the camera with wide, adorable, expressive eyes. Its feathers are soft and voluminous, catching the cool moonlight with subtle silver highlights. The owl''s gaze is curious and full of charm, giving it a whimsical, storybook-like personality.", "style_medium": "digital illustration"}'
      responses:
        '200':
          description: Successful operation (Synchronous Success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSuccessStructPromptGenerate'
        '202':
          description: Accepted (Asynchronous). You can track the progress and retrieve the final result using the Status Service. For more details, refer to the [Status Service](https://docs.bria.ai/status) section.
          content:
            application/json:
