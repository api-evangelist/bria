  /image/generate/lite:
    servers:
    - url: https://engine.prod.bria-api.com/v2
    post:
      summary: Generate Image - Lite
      tags:
      - Endpoints
      servers:
      - url: https://engine.prod.bria-api.com/v2
      description: "[**Try out this capability in Bria's sandbox**](https://platform.bria.ai/image-generation/fibo-lite-generate/sandbox)\n\n\n**Description**\n\nGenerates a new image based on your inputs using the **fast and efficient Fibo Lite Pipeline**.\n\nThis all-in-one endpoint utilizes a two-step local-compatible process:\n1. **FIBO-VLM Bridge:** Translates your input (`prompt` and/or `images`) into a structured JSON prompt using Bria's efficient open-source VLM, optimized for rapid inference.\n2. **Fibo Lite Model:** Internally uses the distilled Fibo Lite text-to-image model to generate the final visual. This model is engineered for **low latency**, ensuring faster generation times.\n\n**Fibo Lite's Benefits**\n\nThis pipeline is designed for **speed and privacy**. It delivers significantly faster generation times suitable for high-throughput workflows. \n\nAdditionally, by pairing the distilled Fibo Lite text-to-image model with the FIBO-VLM bridge, the entire pipeline is capable of **fully local, on-prem deployment**.\n\nTo access the local deployment package, please contact us at <a href=\"mailto:support@bria.ai\">support@bria.ai</a>.\n\nFor advanced, programmatic control, you can also pass in your own `structured_prompt` (e.g., from a previous response or the `/v2/structured_prompt/generate/lite` endpoint) to bypass the internal VLM bridge. This allows for precise, auditable refinement or recreation of an image, or to generate multiple variations from the same structured prompt.\n\n---\n\n**Input Combination Rules**\n\nThe request body must include **one** of the following mutually exclusive combinations:\n\n* `prompt` (Generates a new image from text)\n* `images` (Generates a new image inspired by a reference image)\n* `images` + `prompt` (Generates a new image inspired by an image and guided by text)\n* `structured_prompt` (Recreates a previous image exactly, combined with a seed)\n* `structured_prompt` + `prompt` (Refines a previous image using new text instructions, combined with a seed)\n\n---\n** API Access **\n\nYou can register and access the API Token through Bria's platform <a href=\"https://platform.bria.ai/console/account/api-keys\" target=\"_blank\">by clicking here</a>.\n\n---\n***Examples***\n\n**Use Case 1: Using a textual prompt**\n\n* **Input Prompt:** `photorealistic, high resolution rendering, balloon of lettering, \"HAPPY NEW YEAR 2026\", used color is Pantone Bran, Crocus, Deja vu blue, perfect composition and alignment, natural light set, white backdrop, ultra realistic, rich detail`\n* **Output Image:** ![Example of text-to-image output](https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-lite/new_year_2026.png)\n* **Output `structured_prompt`:**\n    ```json\n    \n    {\n      \"short_description\": \"A photorealistic, high-resolution rendering of balloon lettering spelling out \\\"HAPPY NEW YEAR 2026\\\" against a pristine white background. The balloons are meticulously crafted with a metallic, reflective surface, showcasing a vibrant color palette of Pantone Bran, Crocus, and Deja vu blue. The composition is perfectly aligned and balanced, emphasizing the celebratory message with natural, soft lighting that creates subtle, elegant reflections and shadows.\",\n      \"objects\": [\n        {\n          \"description\": \"A cluster of inflated balloons forming the letters \\\"HAPPY NEW YEAR 2026\\\". Each balloon is individually rendered with realistic inflation, knot, and metallic sheen.\",\n          \"location\": \"center\",\n          \"relationship\": \"The balloons are arranged in two lines: the upper line spelling \\\"HAPPY NEW YEAR\\\" and the lower line spelling \\\"2026\\\".\",\n          \"relative_size\": \"large within frame\",\n          \"shape_and_color\": \"Spherical and teardrop shapes, in metallic shades of Pantone Bran (yellow-orange), Crocus (pink), and Deja vu blue (deep blue).\",\n          \"texture\": \"smooth, glossy, metallic, reflective\",\n          \"appearance_details\": \"Each balloon has a visible knot at the bottom, and their surfaces reflect light with a subtle, iridescent quality, mimicking real foil balloons.\",\n          \"number_of_objects\": 20,\n          \"orientation\": \"upright\"\n        }\n      ],\n      \"background_setting\": \"A clean, bright, and uniform white background, providing stark contrast to the colorful balloons and ensuring maximum readability and visual impact.\",\n      \"lighting\": {\n        \"conditions\": \"bright, even studio lighting\",\n        \"direction\": \"soft, diffused lighting from multiple sources\",\n        \"shadows\": \"subtle, soft, and elongated shadows cast by the balloons onto the white background, indicating a light source from above and slightly to the front, adding depth without distraction.\"\n      },\n      \"aesthetics\": {\n        \"composition\": \"centered, symmetrical, and balanced composition, with the text arranged in two horizontal lines\",\n        \"color_scheme\": \"A harmonious blend of warm (Pantone Bran, Crocus) and cool (Deja vu blue) metallic colors against a neutral white, creating a festive yet sophisticated palette.\",\n        \"mood_atmosphere\": \"festive, celebratory, elegant, joyful, optimistic\",\n        \"preference_score\": \"very high\",\n        \"aesthetic_score\": \"very high\"\n      },\n      \"photographic_characteristics\": {\n        \"depth_of_field\": \"deep\",\n        \"focus\": \"sharp focus on all balloons and text\",\n        \"camera_angle\": \"eye-level\",\n        \"lens_focal_length\": \"standard lens (e.g., 50mm)\"\n      },\n      \"style_medium\": \"3D render\",\n      \"text_render\": [\n        {\n          \"text\": \"HAPPY NEW YEAR\",\n          \"location\": \"top-center\",\n          \"size\": \"large\",\n          \"color\": \"metallic (Pantone Bran, Crocus, Deja vu blue)\",\n          \"font\": \"rounded, sans-serif balloon letters\",\n          \"appearance_details\": \"Each letter is formed by multiple inflated balloons, with the colors cycling through the palette.\"\n        },\n        {\n          \"text\": \"2026\",\n          \"location\": \"bottom-center\",\n          \"size\": \"large\",\n          \"color\": \"metallic (Pantone Bran, Crocus, Deja vu blue)\",\n          \"font\": \"rounded, sans-serif balloon numbers\",\n          \"appearance_details\": \"Each number is formed by multiple inflated balloons, with the colors cycling through the palette.\"\n        }\n      ],\n      \"context\": \"This is a graphic design asset or a celebratory greeting card, likely intended for New Year's Eve promotions, digital greetings, or print media for the year 2026.\",\n      \"artistic_style\": \"photorealistic, festive, clean\"\n    }\n    ```\n---\n\n**Use Case 2: Drawing inspiration from a reference image**\n\n* **Input Image:** ![Example of reference image input](https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-lite/ref_1.jpg)\n* **Input Prompt:** `generate a couple in this style`\n* **Output Image:** ![Example of image-to-image output](https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-lite/generate_a_couple_in_this_style.png)\n* **Output `structured_prompt`:**\n    ```json\n    {\n      \"short_description\": \"A vibrant and dynamic painting in the style of Vincent van Gogh, depicting a couple standing in a landscape under a swirling, star-filled night sky. The scene features rolling hills, a small village with a church steeple, and cypress trees, all rendered with thick impasto brushstrokes and a rich, saturated color palette dominated by blues and yellows.\",\n      \"objects\": [\n        {\n          \"description\": \"A man with short, dark hair and a light-colored shirt, standing with his left arm around a woman.\",\n          \"location\": \"center-left foreground\",\n          \"relationship\": \"The man is embracing the woman, standing together in the landscape.\",\n          \"relative_size\": \"large within frame\",\n          \"shape_and_color\": \"Human figures, with earthy tones for clothing and skin.\",\n          \"texture\": \"Thick, impasto brushstrokes, giving a textured, painterly feel.\",\n          \"appearance_details\": \"Their faces are turned slightly towards each other, with soft, warm expressions.\",\n          \"pose\": \"Standing upright, with the man's left arm around the woman's waist.\",\n          \"expression\": \"Calm and affectionate.\",\n          \"clothing\": \"The man wears a light-colored, possibly blue or white, shirt. The woman wears a dark dress.\",\n          \"action\": \"Embracing.\",\n          \"gender\": \"male\",\n          \"skin_tone_and_texture\": \"Fair skin tones, rendered with visible brushstrokes.\",\n          \"orientation\": \"vertical\"\n        },\n        {\n          \"description\": \"A woman with long, dark hair and a dark dress, standing next to a man.\",\n          \"location\": \"center-left foreground\",\n          \"relationship\": \"The woman is embraced by the man, standing together in the landscape.\",\n          \"relative_size\": \"large within frame\",\n          \"shape_and_color\": \"Human figures, with earthy tones for clothing and skin.\",\n          \"texture\": \"Thick, impasto brushstrokes, giving a textured, painterly feel.\",\n          \"appearance_details\": \"Her face is turned slightly towards the man, with soft, warm expressions.\",\n          \"pose\": \"Standing upright, with her right arm gently resting on the man's arm.\",\n          \"expression\": \"Calm and affectionate.\",\n          \"clothing\": \"The woman wears a dark, possibly blue or green, dress.\",\n          \"action\": \"Embracing.\",\n          \"gender\": \"female\",\n          \"skin_tone_and_texture\": \"Fair skin tones, rendered with visible brushstrokes.\",\n          \"orientation\": \"vertical\"\n        },\n        {\n          \"description\": \"A tall, slender cypress tree with dark green foliage.\",\n          \"location\": \"mid-left foreground\",\n          \"relationship\": \"It stands prominently in the foreground, partially obscuring the village and providing a vertical element against the swirling sky.\",\n          \"relative_size\": \"large within frame\",\n          \"shape_and_color\": \"Conical shape, dark green with hints of brown and black.\",\n          \"texture\": \"Rough, textured surface created by thick paint application.\",\n          \"appearance_details\": \"The brushstrokes are visible, giving it a sense of movement and depth.\",\n          \"orientation\": \"vertical\"\n        },\n        {\n          \"description\": \"A small village with several houses and a prominent church steeple.\",\n          \"location\": \"mid-ground, spanning from left to right\",\n          \"relationship\": \"The village is nestled in the valley below the hills and beneath the starry sky, providing a sense of scale and human presence.\",\n          \"relative_size\": \"medium\",\n          \"shape_and_color\": \"Various rectangular and triangular shapes for houses, with a tall, slender steeple. Colors are predominantly blues, browns, and whites.\",\n          \"texture\": \"Painterly texture with visible brushstrokes, suggesting architectural forms.\",\n          \"appearance_details\": \"Some windows of the houses appear lit, adding warmth to the scene. The church steeple is light-colored and stands out against the darker hills.\",\n          \"number_of_objects\": 1,\n          \"orientation\": \"horizontal\"\n        },\n        {\n          \"description\": \"A bright yellow full moon, surrounded by a soft glow.\",\n          \"location\": \"top-right\",\n          \"relationship\": \"The moon is a central celestial body in the dramatic sky, illuminating the scene.\",\n          \"relative_size\": \"large\",\n          \"shape_and_color\": \"Circular, bright yellow with lighter highlights.\",\n          \"texture\": \"Smooth yet painterly, with visible brushstrokes creating a luminous effect.\",\n          \"appearance_details\": \"It has a distinct halo effect, radiating light.\",\n          \"orientation\": \"vertical\"\n        }\n      ],\n      \"background_setting\": \"A vast, swirling night sky filled with numerous bright yellow stars and dynamic blue and white clouds. The sky transitions from deep indigo at the top to lighter blues and greens closer to the horizon. Below the sky, there are undulating hills and fields, rendered in various shades of blue, purple, and green, suggesting a rural landscape.\",\n      \"lighting\": {\n        \"conditions\": \"moonlight and starlight\",\n        \"direction\": \"diffuse from above and right (from the moon)\",\n        \"shadows\": \"soft, implied shadows on the hills and trees, contributing to depth but not sharply defined.\"\n      },\n      \"aesthetics\": {\n        \"composition\": \"dynamic and asymmetrical, with the couple and cypress trees anchoring the left side, balanced by the moon and village on the right. The swirling sky creates a sense of movement and draws the eye across the canvas.\",\n        \"color_scheme\": \"predominantly cool blues and greens, contrasted with warm yellows of the stars and moon, creating a high-contrast and energetic palette.\",\n        \"mood_atmosphere\": \"dreamlike, romantic, serene yet dramatic, with a sense of wonder and cosmic connection.\",\n        \"preference_score\": \"very high\",\n        \"aesthetic_score\": \"very high\"\n      },\n      \"photographic_characteristics\": {\n        \"depth_of_field\": \"deep\",\n        \"focus\": \"all elements are in focus, characteristic of a painting, with emphasis on the brushwork.\",\n        \"camera_angle\": \"eye-level, as if observing the landscape and sky from a standing position.\",\n        \"lens_focal_length\": \"standard lens (e.g., 35mm-50mm)\"\n      },\n      \"style_medium\": \"oil painting\",\n      \"context\": \"An artistic interpretation of a romantic landscape, evoking the style and emotional intensity of Van Gogh's post-impressionist works. It could be used as a fine art piece, a book cover, or a romantic illustration.\",\n      \"artistic_style\": \"Post-Impressionist, Van Gogh-esque, expressive.\"\n      }\n    ```\n\n---\n\n**Use Case 3: Refining a previously generated image**\n\n* **Input Image (from previous response - shouldn't be part of the refine request):** ![Example of input image](https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-lite/A_hyper_detailed__ultra_fluffy_owl_sitting_in_the_trees_at_night__looking_direct.png)\n* **Input `structured_prompt` (from previous response - should be part of the refine request, toegther with the seed of the visual result):**\n    ```json\n    {\n      \"short_description\": \"A hyper-detailed, ultra-fluffy owl sitting in the trees at night, looking directly at the camera with wide, adorable, expressive eyes. Its feathers are soft and voluminous, catching the cool moonlight with subtle silver highlights. The owl's gaze is curious and full of charm, giving it a whimsical, storybook-like personality.\",\n      \"objects\": [\n        {\n          \"description\": \"An adorable, fluffy owl with large, expressive eyes and soft, voluminous feathers. It has a round head, small ear tufts, and a slightly downturned beak. Its plumage is a mix of warm browns, grays, and subtle silver highlights from the moonlight.\",\n          \"location\": \"center\",\n          \"relationship\": \"The owl is the sole subject, perched comfortably within its environment.\",\n          \"relative_size\": \"large within frame\",\n          \"shape_and_color\": \"Round head, oval body, predominantly brown and grey with silver highlights.\",\n          \"texture\": \"Extremely soft, fluffy, and detailed feathers, giving a plush toy-like appearance.\",\n          \"appearance_details\": \"The eyes are wide, dark, and reflective, conveying a sense of wonder and innocence. The beak is small and light-colored, almost blending with the feathers.\",\n          \"number_of_objects\": 1,\n          \"pose\": \"Sitting upright, body facing slightly to the right, head turned to face forward.\",\n          \"expression\": \"Curious, innocent, and charming.\",\n          \"action\": \"Sitting and observing.\",\n          \"gender\": \"unknown\",\n          \"orientation\": \"upright\"\n        }\n      ],\n      \"background_setting\": \"A dark, blurred forest at night, with hints of tree trunks and foliage visible. The background is uniformly dark, emphasizing the owl as the central focus. Moonlight subtly illuminates parts of the background, creating a soft, ethereal glow.\",\n      \"lighting\": {\n        \"conditions\": \"moonlight\",\n        \"direction\": \"top-left, casting subtle highlights\",\n        \"shadows\": \"soft, diffused shadows on the right side of the owl and within the background foliage, indicating a gentle light source.\"\n      },\n      \"aesthetics\": {\n        \"composition\": \"centered, portrait composition, with the owl filling a significant portion of the frame.\",\n        \"color_scheme\": \"cool blues and silvers from the moonlight contrasting with warm browns and grays of the owl's feathers, creating a balanced and enchanting palette.\",\n        \"mood_atmosphere\": \"magical, serene, whimsical, and endearing.\",\n        \"preference_score\": \"very high\",\n        \"aesthetic_score\": \"very high\"\n      },\n      \"photographic_characteristics\": {\n        \"depth_of_field\": \"shallow\",\n        \"focus\": \"sharp focus on the owl's face and eyes, with a soft blur in the background.\",\n        \"camera_angle\": \"eye-level, as if observing the owl directly.\",\n        \"lens_focal_length\": \"portrait lens (e.g., 50mm-85mm)\"\n      },\n      \"style_medium\": \"digital illustration\",\n      \"context\": \"A whimsical character illustration, likely intended for children's books, animated media, or as a charming decorative art piece.\",\n      \"artistic_style\": \"fantasy, cute, detailed\"\n    }\n    ```\n* **Input Refinement Prompt:** `turn the scene into a daylight scene, with sunlight`\n* **Output Image:** ![Example of refinement output](https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-lite/turn_the_scene_into_a_daylight_scene__with_sunlight.png)\n* **Output `structured_prompt` (refined):**\n    ```json\n    {\n      \"short_description\": \"A hyper-detailed, ultra-fluffy owl sitting in the trees during the day, looking directly at the camera with wide, adorable, expressive eyes. Its feathers are soft and voluminous, catching the warm sunlight with subtle golden highlights. The owl's gaze is curious and full of charm, giving it a whimsical, storybook-like personality.\",\n      \"objects\": [\n        {\n          \"description\": \"An adorable, fluffy owl with large, expressive eyes and soft, voluminous feathers. It has a round head, small ear tufts, and a slightly downturned beak. Its plumage is a mix of warm browns, grays, and subtle golden highlights from the sunlight.\",\n          \"location\": \"center\",\n          \"relationship\": \"The owl is the sole subject, perched comfortably within its environment.\",\n          \"relative_size\": \"large within frame\",\n          \"shape_and_color\": \"Round head, oval body, predominantly brown and grey with golden highlights.\",\n          \"texture\": \"Extremely soft, fluffy, and detailed feathers, giving a plush toy-like appearance.\",\n          \"appearance_details\": \"The eyes are wide, dark, and reflective, conveying a sense of wonder and innocence. The beak is small and light-colored, almost blending with the feathers.\",\n          \"number_of_objects\": 1,\n          \"pose\": \"Sitting upright, body facing slightly to the right, head turned to face forward.\",\n          \"expression\": \"Curious, innocent, and charming.\",\n          \"action\": \"Sitting and observing.\",\n          \"gender\": \"unknown\",\n          \"orientation\": \"upright\"\n        }\n      ],\n      \"background_setting\": \"A dark, blurred forest during the day, with hints of tree trunks and foliage visible. The background is uniformly dark, emphasizing the owl as the central focus. Sunlight subtly illuminates parts of the background, creating a soft, ethereal glow.\",\n      \"lighting\": {\n        \"conditions\": \"sunlight\",\n        \"direction\": \"top-left, casting subtle highlights\",\n        \"shadows\": \"soft, diffused shadows on the right side of the owl and within the background foliage, indicating a gentle light source.\"\n      },\n      \"aesthetics\": {\n        \"composition\": \"centered, portrait composition, with the owl filling a significant portion of the frame.\",\n        \"color_scheme\": \"warm yellows and oranges from the sunlight contrasting with warm browns and grays of the owl's feathers, creating a balanced and enchanting palette.\",\n        \"mood_atmosphere\": \"magical, serene, whimsical, and endearing.\",\n        \"preference_score\": \"very high\",\n        \"aesthetic_score\": \"very high\"\n      },\n      \"photographic_characteristics\": {\n        \"depth_of_field\": \"shallow\",\n        \"focus\": \"sharp focus on the owl's face and eyes, with a soft blur in the background.\",\n        \"camera_angle\": \"eye-level, as if observing the owl directly.\",\n        \"lens_focal_length\": \"portrait lens (e.g., 50mm-85mm)\"\n      },\n      \"style_medium\": \"digital illustration\",\n      \"context\": \"A whimsical character illustration, likely intended for children's books, animated media, or as a charming decorative art piece.\",\n      \"artistic_style\": \"fantasy, cute, detailed\"\n    }\n    ```"
      operationId: image-generate-lite
      parameters:
      - in: header
        name: api_token
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt:
                  type: string
                  description: 'Text-based instruction. Can be used alone to create a new prompt, or as a refinement command with an `images` or `structured_prompt`.

                    '
                images:
                  type: array
                  items:
                    type: string
                  maxItems: 1
                  description: "Publicly available URL or Base64-encoded image. Currently supports a single image. \nSupported formats: **JPEG**, **JPG**, **PNG**, **WEBP**.\n"
                structured_prompt:
                  type: string
                  description: 'A string containing the structured prompt in JSON format. Use a `structured_prompt` from a previous generation''s response or the `/v2/structured_prompt/generate/lite` endpoint for precise refinement.

                    '
                model_version:
                  type: string
                  description: 'Generation model version. This parameter is optional.

                    * **If omitted (Default)**: Your request will automatically use Bria''s current default model. This ensures you always benefit from our latest improvements.

                    * **If specified (e.g., "FIBO")**: Your request will be pinned to this exact version.

                    '
                  enum:
                  - FIBO
                aspect_ratio:
                  type: string
                  description: Image aspect ratio. This parameter is optional.
                  default: '1:1'
                  enum:
                  - '1:1'
                  - '2:3'
                  - '3:2'
                  - '3:4'
                  - '4:3'
                  - '4:5'
                  - '5:4'
                  - '9:16'
                  - '16:9'
                seed:
                  type: integer
                  description: Seed for deterministic generation. Uses a random seed if omitted. This parameter is optional.
                sync:
                  type: boolean
                  default: false
                  description: 'Response mode. This parameter is optional.

                    * `false` (default): Asynchronous. Returns 202 with a `status_url` to poll.

                    * `true`: Synchronous. Holds the connection and returns 200 with the final result.

                    '
                webhook_url:
                  type: string
                  format: uri
                  description: Optional URL for receiving the result via webhook when the async job completes. See [Webhooks](https://docs.bria.ai/webhooks).
                output_type:
                  type: string
                  default: png
                  enum:
                  - png
                  - jpeg
                  description: The desired output format
                ip_signal:
                  type: boolean
                  default: false
                  description: If true, returns a warning for potential IP content in the `prompt` parameter. This parameter is optional.
                prompt_content_moderation:
                  type: boolean
                  default: true
                  description: If true, returns 422 on input prompt moderation failure in the `prompt` parameter. This parameter is optional.
                visual_input_content_moderation:
                  type: boolean
                  default: true
                  description: If true, returns 422 on visual input moderation failure. This parameter is optional.
                visual_output_content_moderation:
                  type: boolean
                  default: true
                  description: If true, returns 422 on visual output moderation failure. This parameter is optional.
            examples:
              Generate a new image using a textual prompt:
                value:
                  prompt: A photorealistic, high-resolution rendering of balloon lettering spelling out "HAPPY NEW YEAR 2026" against a pristine white backdrop. The balloons are meticulously crafted with a metallic, reflective surface, showcasing a vibrant color palette of Pantone Bran, Crocus, and Deja vu blue. The composition is perfectly aligned and balanced, emphasizing the celebratory message with natural, soft lighting that creates subtle, elegant reflections and shadows.
              Generate an image inspired by a reference image:
                value:
                  prompt: generate a couple in this style
                  images:
                  - https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-lite/ref_1.jpg
              Generate an image using only a reference image:
                summary: Generate an image inspired by only a reference image
                value:
                  images:
                  - https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-lite/ref_1.jpg
              Refine a previously generated image using its structured_prompt and seed:
