  /gen_fill:
    post:
      summary: Generative Fill
      tags:
      - v2 endpoints
      servers:
      - url: https://engine.prod.bria-api.com/v2/image/edit
      description: "[**Try out this capability in Bria's sandbox**](https://platform.bria.ai/image-editing/generative-fill)\n\n**Description**\n\nThe *GenFill Route* enables the generation of objects by prompt in a specific region of an image.\n\nYou can define the area for object generation by using a mask that outlines the region where the object will be created. Our model is optimized to work seamlessly with blob-shaped masks.\n\nMasks can be created by allowing users to draw directly on the image with a brush, for example. To access the SDK that demonstrates how to implement a brush feature in your interface, please refer to the following <a href=\"https://github.com/Bria-AI/js-api-sdk/blob/main/manual_brush_ui\" target=\"_blank\">link</a>.\n\n**Output Characteristics**\n\n- The modified image is returned at the original resolution, preserving full visual quality without any automatic resizing or downscaling.\n- All areas outside the provided mask remain completely unchanged, ensuring pixel-perfect preservation of unedited regions.\n- If the input includes an alpha channel and `preserve_alpha=true`, the original transparency values (both full and partial) are maintained in the output.\n\n**Content Moderation**\n\nThis endpoint includes granular content moderation controls to ensure safe usage across all stages of processing:\n  \n- **Prompt Moderation** – Validates the provided prompt and rejects requests containing unsafe or prohibited terms before processing starts.\n- **Input Image Moderation** – Scans the uploaded image and stops processing if inappropriate or restricted content is detected.\n- **Output Image Moderation** – Evaluates the generated image and blocks the response if it violates safety guidelines."
      operationId: gen-fill
      parameters:
      - in: header
        name: api_token
        schema:
          type: string
        required: true
        description: API token associated with the organization.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - image
              - mask
              - prompt
              properties:
                image:
                  type: string
                  description: "The source image to be handled by the API.  \nSupported input types:  \n- **Base64-encoded string**\n- **URL** pointing to an image file that is publicly accessible and available at the time of processing.  \n\nAccepted formats: **JPEG**, **JPG**, **PNG**, **WEBP**.\n"
                mask:
                  type: string
                  description: 'The binary mask image that defines the region where object generation will occur.


                    **Mask Requirements**

                    - The region to generate content must have a pixel value of **255 (white)**.

                    - All other areas must have a pixel value of **0 (black)**.

                    - The mask must have the **same aspect ratio** as the input image.


                    **Supported Input Types**

                    - **Base64-encoded string** – provide the mask data directly in the request.

                    - **URL** – provide a publicly accessible URL to the mask image.


                    Accepted formats: **JPEG**, **JPG**, **PNG**, **WEBP**.


                    Ensure that any provided URL is publicly accessible at the time of the request.

                    '
                prompt:
                  type: string
                  description: 'The prompt you would like to use to generate the object within the masked region.


                    Prompt Length Limits: ~90-110 words

                    '
                refine_prompt:
                  type: boolean
                  default: true
                  description: 'Controls the automatic prompt refinement feature.

                    - **`true` (default):** The provided prompt is automatically adjusted for optimal results. The adjusted prompt is then returned in the response payload as `refined_prompt`.

                    - **`false`:** The original prompt is used as-is, without modification.

                    '
                prompt_content_moderation:
                  type: boolean
                  default: true
                  description: "When enabled (default: `true`), the input prompt is moderated before processing.\n\n**Expected Behavior**\n- The prompt is scanned for NSFW content and terms that violate Bria’s ethical guidelines.  \n- If the prompt fails moderation, the request is blocked and the API responds with a 422 error.\n"
                negative_prompt:
                  type: string
                  description: The prompt you would like to use to specify details or attributes to avoid in the object generated within the masked region.
                preserve_alpha:
                  type: boolean
                  default: true
                  description: 'Controls whether the alpha channel values from the input image are retained in the output, if the input includes an alpha channel.

                    - When true: The output image maintains the original transparency of fully and partially transparent pixels.

                    - When false: The output image is fully opaque.

                    - Has no effect if the input image does not include an alpha channel.

                    '
                sync:
                  type: boolean
                  default: false
                  description: "Specifies the response mode.\n  - When `false` (default), the request is processed asynchronously: the API immediately returns a status URL to track progress.\n  - When `true`, the request is processed synchronously: the API hold the connection open until the proccess is complete and then returns the final image URL in the response.\n"
                webhook_url:
                  type: string
                  format: uri
                  description: Optional URL for receiving the result via webhook when the async job completes. See [Webhooks](https://docs.bria.ai/webhooks).
                seed:
                  type: integer
                  description: You can choose whether you want your generated results to be random or predictable. You can recreate the same result in the future by using the seed value of a result from a response. You can exclude this parameter if you are not interested in recreating your results. This parameter is optional.
                visual_input_content_moderation:
                  type: boolean
                  default: false
                  description: 'When enabled, applies content moderation to input visual.


                    Expected behavior:

                    - Processing stops if the image fails moderation.

                    - Returns a 422 error with details about which parameter failed.

                    '
                visual_output_content_moderation:
                  type: boolean
                  default: false
                  description: 'When enabled, applies content moderation to result visual.


                    Expected behavior:

                    - If the modified image fails moderation, returns a 422 error.

                    '
            examples:
              send using url:
                value:
                  image: https://labs-assets.bria.ai/sandbox-example-inputs/genfill_image_example.jpg
                  mask: https://labs-assets.bria.ai/sandbox-example-inputs/genfill_mask_exmple.jpg
                  prompt: A red delicious cherry
      responses:
        '200':
          description: Successful operation (Synchronous Success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSuccessResponse'
        '202':
          description: Accepted (Asynchronous). You can track the progress and retrieve the final result using the Status Service. For more details, refer to the [Status Service](https://docs.bria.ai/status) section.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncInitialResponse'
        '400':
          description: Bad request. This can be due to a malformed request, invalid JSON, or a missing required parameter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
