              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: "Not Found. The requested resource could not be found. This can be due to:\n- The image or mask URL could not be found.\n   content:\napplication/json:\n  schema:\n    $ref: '#/components/schemas/ErrorResponse'\n"
        '415':
          description: Unsupported media type.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'Unprocessable Entity. This error is returned for validation failures, such as:

            - A parameter failing content moderation (e.g., `prompt_content_moderation: true` and an unsafe prompt).

            - Image or mask requirements not being met (e.g., different aspect ratios).

