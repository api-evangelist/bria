                  type: integer
                  description: Optional. Seed for deterministic generation. If omitted, a random seed is generated and used.
                sync:
                  type: boolean
                  default: false
                  description: "Specifies the response mode. Optional.\n  - When `false` (default), the request is processed asynchronously: the API immediately returns a status URL to track progress.\n  - When `true`, the request is processed synchronously: the API hold the connection open until the proccess is complete and then returns the final result in the response.\n"
