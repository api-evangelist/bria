                  description: "The image that you would like to remove the background from.\nSupported input types:  \n- **Base64-encoded string**  \n- **URL** pointing to an image file that is publicly accessible and available at the time of processing.  \n\nAccepted formats: **JPEG**, **JPG**, **PNG**, **WEBP**.\n"
                preserve_alpha:
                  type: boolean
                  default: true
                  description: 'Controls whether partially transparent areas from the input image are retained in the output after background removal, if the input includes an alpha channel.

                    - When true: Partially transparent pixels preserve their original alpha values in the output.

                    - When false: All non-background areas in the output are rendered fully opaque.

                    - Has no effect if the input image does not include an alpha channel.

                    '
                sync:
                  type: boolean
                  default: false
                  description: "Specifies the response mode.\n  - When `false` (default), the request is processed asynchronously: the API immediately returns a status URL to track progress.\n  - When `true`, the request is processed synchronously: the API hold the connection open until the proccess is complete and then returns the final image URL in the response.\n"
                webhook_url:
                  type: string
                  format: uri
                  description: Optional URL for receiving the result via webhook when the async job completes. See [Webhooks](https://docs.bria.ai/webhooks).
                visual_input_content_moderation:
                  type: boolean
                  default: false
                  description: 'When enabled, applies content moderation to input visual.


                    Expected behavior:

                    - Processing stops if the image fails moderation.

                    - Returns a 422 error with details about which parameter failed.

                    '
                visual_output_content_moderation:
                  type: boolean
                  default: false
                  description: 'When enabled, applies content moderation to result visual.


                    Expected behavior:

                    - If the modified image fails moderation, returns a 422 error.

                    '
            examples:
