      - url: https://engine.prod.bria-api.com/v2/image/edit
      description: "[**Try out this capability in Bria's sandbox**](https://platform.bria.ai/image-editing/replace-background)\n\n\n**Description**\n\n\n\nThe *Replace BG Route* is used to replace the background of any image.\n\n\nWe offer 3 different background generation modes when generating by text: base, high contol and fast.\n\n  - **Base** - clean, high quality backgrounds.\n  - **High_control** - Stronger prompt adherence and scene context, finer control over layout and details - **we recommend using this mode.**\n  - **Fast** - same core capabilities as base, optimal speed and quality balace.\n\n\nThis endpoint also allows replacing the background with a solid color of your choice. You can specify a hex color code (e.g., #FF5733) in the prompt to control the background color.\n\n\nHere are some examples:\n\n\n**original image**: \n\n\n<img src=\"https://i.ibb.co/n6JtktM/unnamed-13.jpg\" width=\"200\"/>\n\n\n**prompt**: in a parking lot\n        \n\n\n**result**:\n\n\n<img src=\"https://i.ibb.co/1zvT5h4/unnamed-14.jpg\" width=\"200\"/>\n\n\n**Content Moderation**\n\nThis endpoint includes granular content moderation controls to ensure safe usage across all stages of processing:\n\n- **Prompt Moderation** – Validates the provided prompt and rejects requests containing unsafe or prohibited terms before processing starts.\n- **Input Image Moderation** – Scans the uploaded image and stops processing if inappropriate or restricted content is detected.\n- **Output Image Moderation** – Evaluates the generated image and blocks the response if it violates safety guidelines."
      operationId: background-replace
      parameters:
      - in: header
        name: api_token
        schema:
          type: string
        required: true
        description: API token associated with the organization.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - image
              properties:
                image:
                  type: string
                  description: "The image that you would like to remove the background from.\nSupported input types:  \n- **Base64-encoded string**  \n- **URL** pointing to an image file that is publicly accessible and available at the time of processing.  \n\nAccepted formats: **JPEG**, **JPG**, **PNG**, **WEBP**.\n"
                mode:
                  type: string
                  enum:
                  - base
                  - high_control
                  - fast
                  default: high_control
                  description: 'Selects the background-generation mode.

                    Relevant only when describing the background by text.


                    - **Base** - clean, high quality backgrounds.

                    - **High_control** - stronger prompt adherence and scene context, finer control over layout and details.

                    - **Fast** - same core capabilities as base, optimal speed and quality balace.

                    '
                ref_images:
                  type: string
                  description: "One or more reference images to guide the background generation.  \n\n**Supported Input Types**  \n- **Base64-encoded string** – provide the image data directly in the request.  \n- **URL** – provide a publicly accessible URL to the image.  \n- **List** – multiple images can be supplied as a list of Base64 strings or URLs.  \n\n**Usage Constraints**  \n- You must provide **either** `ref_images` **or** `prompt`, but not both.  \n- Accepted formats: **JPEG**, **JPG**, **PNG**, **WEBP**.  \n\nAll provided images must be accessible and in a supported format at the time of processing.\n"
                enhance_ref_images:
                  type: boolean
                  default: true
                  description: When set to true, additional logic processes the included reference image to make adjustments for optimal results.
                prompt:
                  type: string
                  description: "Text description of the new scene or background for the provided image. Either ref_images or prompt has to be provided but not both. Bria currently supports prompts in English only, excluding special characters.\n\n**Prompt length guidelines per mode:**\n  - base / fast: ~50–60 words\n  - high_control: ~90–110 words\n"
                refine_prompt:
                  type: boolean
                  default: true
                  description: When true, an additional logic takes the prompt that was included and adjusts it to achieve optimal results.
                prompt_content_moderation:
                  type: boolean
                  default: true
                  description: "When enabled (default: `true`), the input prompt is moderated before processing.\n\n**Expected Behavior**\n- The prompt is scanned for NSFW content and terms that violate Bria’s ethical guidelines.  \n- If the prompt fails moderation, the request is blocked and the API responds with a 422 error.\n\n**Prompt length guidelines per mode:**\n- base / fast: ~50–60 words\n- high_control: ~90–110 words\n"
                negative_prompt:
                  type: string
                  description: Elements or features that should be excluded from the generated scene. This parameter is optional and is available only when fast=false. Bria currently supports descriptions in English only.
                original_quality:
                  type: boolean
                  default: false
                  description: When true, the output image retains the original input image's size; otherwise, the image is scaled to 1 megapixel (1MP) while preserving its aspect ratio.
                force_background_detection:
                  type: boolean
                  default: false
                  description: When `true`, forces background detection and removal, even if the original image already contains an alpha channel. Useful for refining existing foreground/background separation or ignoring unnecessary alpha channels.
                sync:
                  type: boolean
                  default: false
                  description: "Specifies the response mode.\n  - When `false` (default), the request is processed asynchronously: the API immediately returns a status URL to track progress.\n  - When `true`, the request is processed synchronously: the API hold the connection open until the proccess is complete and then returns the final image URL in the response.\n"
                webhook_url:
                  type: string
                  format: uri
                  description: Optional URL for receiving the result via webhook when the async job completes. See [Webhooks](https://docs.bria.ai/webhooks).
                visual_output_content_moderation:
                  type: boolean
                  default: false
                  description: "When enabled, applies content moderation to result visual.\n\nExpected behavior:\n- If the modified image fails moderation, returns a 422 error. \n"
                seed:
                  type: integer
                  description: You can choose whether you want your generated results to be random or predictable. You can recreate the same result in the future by using the seed value of a result from the response. You can exclude this parameter if you are not interested in recreating your results. This parameter is optional.
            examples:
