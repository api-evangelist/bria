openapi: 3.2.0
info:
  title: Image Editing API Reference v2 endpoints API
  version: ''
  description: 'Below you will find the technical specifications, request schemas, and response models for our endpoints.


    Choose an endpoint from the sidebar to view code samples and run test requests.'
servers:
- url: https://engine.prod.bria-api.com/v2/image/edit
- url: https://engine.prod.bria-api.com/v1
tags:
- name: v2 endpoints
  description: Endpoints that are part of BRIA API version 2.
paths:
  /image/edit:
    post:
      summary: Image Edit by Text
      tags:
      - v2 endpoints
      servers:
      - url: https://engine.prod.bria-api.com/v2
      description: '**Try out this capability in Bria''s sandbox**


        **Description**


        Powered by the **FIBO models family**, Bria’s Image Editing by Text API equips builders with the ability to modify existing images using natural language instructions or structured JSON instructions.'
      operationId: edit-image
      parameters:
      - in: header
        name: api_token
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - images
              properties:
                images:
                  type: array
                  items:
                    type: string
                  description: "The source image to be edited. Publicly available URL or Base64-encoded. \nAccepted formats: JPEG, JPG, PNG, WEBP. \n**Must contain exactly one item.**\n"
                instruction:
                  type: string
                  description: Text-based edit instruction (e.g., "make the sky blue", "add a cat"). This parameter serves as the text prompt.
                mask:
                  type: string
                  description: "Publicly available URL or Base64-encoded mask image (black and white). \nBlack areas will be preserved, white areas will be edited. If omitted, the edit applies to the entire image. \nThe input image and the input mask must be of the same size.\nThis parameter is optional.\n"
                structured_instruction:
                  type: string
                  description: A string containing the structured edit instruction in JSON format. Use this instead of `instruction` for precise, programmatic control.
                negative_prompt:
                  type: string
                  description: A text prompt specifying concepts, styles, or objects to exclude from the edited image. This parameter is optional.
                guidance_scale:
                  type: integer
                  default: 5
                  minimum: 3
                  maximum: 5
                  description: Determines how closely the generated image should adhere to the content in the instruction or structured_instruction. This parameter is optional.
                model_version:
                  type: string
                  default: FIBO-edit
                  enum:
                  - FIBO-edit
                  description: 'The version of the model to use. This parameter is optional.

                    If omitted (Default): Your request will automatically use Bria''s current default model version (currently FIBO-edit).

                    If specified: Your request will be pinned to this exact version.

                    '
                steps_num:
                  type: integer
                  default: 30
                  minimum: 20
                  maximum: 50
                  description: Number of diffusion steps. Uses model default if omitted. This parameter is optional.
                seed:
                  type: integer
                  description: Seed for deterministic generation. Uses a random seed if omitted. This parameter is optional.
                sync:
                  type: boolean
                  default: false
                  description: "Specifies the response mode. This parameter is optional.\n  - When `false` (default), the request is processed asynchronously: the API immediately returns a status URL to track progress.\n  - When `true`, the request is processed synchronously: the API hold the connection open until the proccess is complete and then returns the final image URL in the response.\n"
                webhook_url:
                  type: string
                  format: uri
                  description: Optional URL for receiving the result via webhook when the async job completes. See [Webhooks](https://docs.bria.ai/webhooks).
                output_type:
                  type: string
                  default: png
                  enum:
                  - png
                  - jpeg
                  description: The desired output format
                ip_signal:
                  type: boolean
                  default: false
                  description: If true, returns a warning for potential IP content in the instruction. This parameter is optional.
                prompt_content_moderation:
                  type: boolean
                  default: true
                  description: If true, returns 422 on instruction moderation failure. This parameter is optional.
                visual_input_content_moderation:
                  type: boolean
                  default: true
                  description: If true, returns 422 on images or mask moderation failure. This parameter is optional.
                visual_output_content_moderation:
                  type: boolean
                  default: true
                  description: If true, returns 422 on visual output moderation failure. This parameter is optional.
            examples:
              text_instruction:
                summary: Global Edit by Text Instruction
                value:
                  instruction: 'change color pallet of the image to: #014040, #02735E, #03A678, #F27405, #731702'
                  images:
                  - https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-edit/pexels-cottonbro-3401900.jpg
              json_instruction:
                summary: Edit by Structured Instruction
                value:
                  images:
                  - https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-edit/42082.jpg
                  structured_instruction: '{"short_description":"A realistic photograph of a brown rabbit sitting on a natural ground surface, looking towards the left. The rabbit has soft fur, long ears, and a small fluffy tail. The scene is captured with a contemporary color scheme and balanced exposure, highlighting the natural textures and details of the animal.","objects":[{"description":"A realistic brown rabbit with soft, detailed fur, long ears, and a small, fluffy white tail. Its eyes are dark and observant, and its whiskers are delicate.","location":"center","relationship":"The main subject of the image, positioned centrally on the ground.","relative_size":"large within frame","shape_and_color":"Oval-shaped body, brown and white fur.","texture":"Soft, dense fur.","appearance_details":"Prominent whiskers, alert eyes, and a twitching nose.","pose":"Sitting with its front paws tucked under its chest and hind legs slightly extended, body slightly turned to the left.","expression":"Alert and curious.","action":"Sitting still, observing its surroundings.","orientation":"Facing left, slightly angled towards the viewer."}],"background_setting":"A softly blurred natural ground surface, possibly grass or dirt, providing a subtle and unobtrusive backdrop that keeps the focus on the rabbit.","lighting":{"conditions":"Bright, natural daylight with balanced exposure.","direction":"Evenly lit from above and slightly to the front.","shadows":"Soft, subtle shadows beneath the rabbit, indicating natural light."},"aesthetics":{"composition":"Centered composition with the rabbit as the main focal point, creating a portrait-like feel.","color_scheme":"Contemporary natural color scheme with earthy tones and subtle greens/browns.","mood_atmosphere":"Calm, natural, and serene.","preference_score":"very high","aesthetic_score":"very high"},"photographic_characteristics":{"depth_of_field":"Shallow depth of field, with the rabbit in sharp focus and the background softly blurred.","focus":"Sharp focus on the rabbit''s face and fur.","camera_angle":"Eye-level, capturing the rabbit from its perspective.","lens_focal_length":"Portrait lens (e.g., 50mm-85mm)"},"style_medium":"photograph","context":"This is a realistic wildlife photograph, suitable for nature magazines, educational materials, or as a decorative print.","artistic_style":"realistic","edit_instruction":"Render a detailed realistic photograph of a brown rabbit sitting on a natural ground surface, looking towards the left, with a contemporary color scheme and balanced exposure."}'
              masked_text_instruction:
                summary: Edit Masked Area
                value:
                  instruction: Write FIBO ROCKS on all balloons, use dark creative font, different font for each balloon
                  images:
                  - https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-edit/pexels-natalie-bond-320378-3371094.jpg
                  mask: https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-edit/pexels-natalie-bond-320378-3371094_mask.png
      responses:
        '200':
          description: Successful operation (Synchronous Success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncEditResponse'
        '202':
          description: Accepted (Asynchronous). You can track the progress and retrieve the final result using the Status Service. For more details, refer to the [Status Service](https://docs.bria.ai/status) section.
          content:
            application/json:
