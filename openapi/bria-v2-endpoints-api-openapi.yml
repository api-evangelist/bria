              schema:
                $ref: '#/components/schemas/ErrorResponse'
        5XX:
          description: Internal Server Error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /structured_instruction/generate:
    post:
      summary: Generate Structured Instruction
      tags:
      - v2 endpoints
      servers:
      - url: https://engine.prod.bria-api.com/v2
      description: '**Description**


        Translates a user''s text-based edit instruction and source image/mask into a detailed, machine-readable structured edit instruction in JSON format.


        This endpoint uses the state-of-the-art Gemini 2.5 Flash VLM bridge to understand the edit context. **It only returns the JSON string and does not generate an image.**


        **Context-Aware Masking**


        When a `mask` is provided, the VLM analyzes the specific region of interest in relation to the rest of the image. It generates a `structured_instruction` tailored specifically for that area (e.g., ensuring lighting and perspective match the unmasked background), ensuring seamless integration when the edit is applied.


        **Why use this endpoint?**

        - **Decoupling:** Decouples the "intent translation" step from the "image editing" step, giving you maximum flexibility.

        - **Control & Auditability:** Allows for a "human-in-the-loop" to inspect, programmatically edit, or version the JSON before generating an image (e.g., for a custom UI).

        - **Consistency & Automation:** Generate one `structured_instruction` and pass it to `/v2/image/edit` multiple times to create consistent, auditable variations.

        - **Hybrid Deployment:** Use Bria''s state-of-the-art VLM bridge via API while self-hosting the open-source FIBO image model on your own private cloud.


        The resulting `structured_instruction` can be used as input for the `/v2/image/edit` endpoint.


        ---


        **Input Combination Rules**

        The request body must use exactly one of the following combinations:

        * **Global Instruction:** `images` + `instruction`

        * **Masked Instruction:** `images` + `mask` + `instruction`


        ---


        **API Access**


        You can register and access the API Token through Bria''s platform by clicking here.'
      operationId: generate-structured-instruction
      parameters:
      - in: header
        name: api_token
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - images
              - instruction
              properties:
                instruction:
                  type: string
                  description: Required. Text-based edit instruction (e.g., "make the sky blue", "add a cat"). This parameter serves as the text prompt.
                images:
                  type: array
                  items:
                    type: string
                  description: Required. The source image to be edited. Publicly available URL or Base64-encoded. Must contain exactly one item.
                mask:
                  type: string
                  description: Optional. Publicly available URL or Base64-encoded mask image (black and white). Black areas will be preserved, white areas will be edited. If omitted, the edit applies to the entire image.
                seed:
                  type: integer
                  description: Optional. Seed for deterministic generation. If omitted, a random seed is generated and used.
                sync:
                  type: boolean
                  default: false
                  description: "Specifies the response mode. Optional.\n  - When `false` (default), the request is processed asynchronously: the API immediately returns a status URL to track progress.\n  - When `true`, the request is processed synchronously: the API hold the connection open until the proccess is complete and then returns the final result in the response.\n"
                webhook_url:
                  type: string
                  format: uri
                  description: Optional URL for receiving the result via webhook when the async job completes. See [Webhooks](https://docs.bria.ai/webhooks).
                ip_signal:
                  type: boolean
                  default: false
                  description: If true, returns a warning for potential IP content in the instruction. Optional.
                prompt_content_moderation:
                  type: boolean
                  default: true
                  description: If true, returns 422 on instruction moderation failure. Optional.
                visual_input_content_moderation:
                  type: boolean
                  default: true
                  description: If true, returns 422 on images or mask moderation failure. Optional.
            examples:
              generate_instruction:
                summary: Generate Instruction from Image & Text
                value:
                  images:
                  - https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-edit/42082.jpg
                  instruction: create a detailed realistic photo, with contemporary color scheme, and balanced exposure photo roughly based on this sketch
              generate_masked_instruction:
                summary: Generate Instruction from Masked Image & Text
                value:
                  images:
                  - https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-edit/pexels-natalie-bond-320378-3371094.jpg
                  mask: https://bria-datasets.s3.us-east-1.amazonaws.com/api_doc/fibo-edit/pexels-natalie-bond-320378-3371094_mask.png
                  instruction: Write FIBO ROCKS on all balloons, use dark creative font, different font for each balloon
      responses:
        '200':
          description: Successful operation (Synchronous Success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncStructuredInstructionResponse'
        '202':
          description: Accepted (Asynchronous). You can track the progress and retrieve the final result using the Status Service. For more details, refer to the [Status Service](https://docs.bria.ai/status) section.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncInitialResponse'
        '400':
          description: Bad request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized.
          content:
