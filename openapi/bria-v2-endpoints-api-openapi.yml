components:
  schemas:
    SyncSuccessWithSeedAndPrompt:
      allOf:
      - $ref: '#/components/schemas/SyncSuccessResponse'
      - type: object
        properties:
          result:
            allOf:
            - $ref: '#/components/schemas/SyncSuccessResponse/properties/result'
            - type: object
              properties:
                seed:
                  type: integer
                prompt:
                  type: string
                  description: Original prompt sent by the user.
    SyncSuccessWithSeedAndRefinedPrompt:
      allOf:
      - $ref: '#/components/schemas/SyncSuccessResponse'
      - type: object
        properties:
          result:
            allOf:
            - $ref: '#/components/schemas/SyncSuccessResponse/properties/result'
            - type: object
              properties:
                seed:
                  type: integer
                refined_prompt:
                  type: string
                  description: 'Refined version of the input prompt.

                    **Returned only when:**

                    - The request included a `prompt` parameter.

                    - The request did NOT include a `reference_image`.

                    '
    SyncStructuredInstructionResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            seed:
              type: integer
            structured_instruction:
              type: string
          required:
          - seed
          - structured_instruction
        request_id:
          type: string
        warning:
          type: string
          description: Returned only when ip_signal = true and the instruction field included IP content.
      required:
      - result
      - request_id
    SyncSuccessResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            image_url:
              type: string
          required:
          - image_url
        request_id:
          type: string
      required:
      - result
      - request_id
    AsyncInitialResponse:
      type: object
      properties:
        request_id:
          type: string
        status_url:
          type: string
      required:
      - request_id
      - status_url
    SyncEditResponse:
      type: object
      properties:
        result:
          type: object
          properties:
            image_url:
              type: string
            seed:
              type: integer
            structured_instruction:
              type: string
          required:
          - image_url
          - seed
          - structured_instruction
        request_id:
          type: string
        warning:
          type: string
          description: Returned only when ip_signal = true and the instruction field included IP content.
      required:
      - result
      - request_id
    ErrorResponse:
      type: object
      properties:
        error:
          $ref: '#/components/schemas/ErrorObject'
        request_id:
          type: string
      required:
      - error
      - request_id
    ErrorObject:
      type: object
      properties:
        code:
          type: integer
          example: 123
        message:
          type: string
        details:
          type: string
      required:
