  /expand:
    post:
      summary: Expand Image
      tags:
      - v2 endpoints
      servers:
      - url: https://engine.prod.bria-api.com/v2/image/edit
      description: '**Try out this capability in Bria''s sandbox**


        **Description**


        The *Image Expension Route* can be used to expand an image, by utilizing generative AI.


        You can decide on the image size of the final result as well as the position and size of the original image compared to the final result.


        Alternatively, you can define a desired aspect_ratio, and the service will automatically place the input image in the center and expand the canvas to match that ratio.


        In this way, you can create unique variations of your original image instead of cropping it into different aspect ratios and losing important details.


        If aspect_ratio is not provided, both original_image_size and original_image_location must be specified.


        **Optimal input range**


        ***Input Image Area:*** Ensure that the ratio of the input image foreground or main subject to the canvas area is greater than 15% to achieve optimal results.


        ***Canvas Size:*** The canvas size should be up to an area of 5000x5000 pixels.


        ***Prompt:*** This parameter is optional. If not provided or left empty, the service will automatically generate a prompt based on the input image.


        **Alpha Channel Handling**


        - If the input image includes an alpha channel and `preserve_alpha=true`, newly generated pixels inherit the alpha values of the nearest original pixels along the same row or column, ensuring smooth transparency transitions.


        - If the input image contains fully transparent pixels along any edge (top, bottom, left, or right), the request is rejected with a 422 error. Expansion is not supported in such cases to avoid undefined transparency behavior.


        Here are some examples:


        **original image (Generated by Bria)**:


        **results**:


        **original image (Stock Image)**:


        **results**:


        **Content Moderation**


        This endpoint includes granular content moderation controls to ensure safe usage across all stages of processing:


        - **Prompt Moderation** – Validates the provided prompt and rejects requests containing unsafe or prohibited terms before processing starts.

        - **Input Image Moderation** – Scans the uploaded image and stops processing if inappropriate or restricted content is detected.

        - **Output Image Moderation** – Evaluates the generated image and blocks the response if it violates safety guidelines.'
      operationId: image-expansion
      parameters:
      - in: header
        name: api_token
        schema:
          type: string
        required: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - image
              properties:
                image:
                  type: string
                  description: "The source image to be handled by the API.  \nSupported input types:  \n- **Base64-encoded string**  \n- **URL** pointing to an image file that is publicly accessible and available at the time of processing.  \n\nAccepted formats: **JPEG**, **JPG**, **PNG**, **WEBP**.\n"
                aspect_ratio:
                  type:
                  - string
                  - number
                  description: 'Automatically expands or crops the input image to the specified aspect ratio.


                    Either `aspect_ratio` or the combination of `original_image_size` and `original_image_location` must be provided.


                    When provided, `canvas_size`, `original_image_size`, and `original_image_location` are ignored.


                    Centers the input image, expanding edges to reach the target ratio.


                    Accepts either:

                    - A predefined string: "1:1", "2:3", "3:2", "3:4", "4:3", "4:5", "5:4", "9:16", "16:9"

                    - A custom float between 0.5 and 3.0


                    If the target ratio equals the input image’s current ratio, no changes are made.


                    If the computed final dimensions exceed 5000×5000 px in total area, the input image is automatically resized so the area stays within limits.

                    '
                canvas_size:
                  type: array
                  items:
                    type: integer
                  default:
                  - 1000
                  - 1000
                  description: 'Desired output canvas dimensions (width, height). Defaults to [1000, 1000] if not provided.

                    Ignored when `aspect_ratio` is used.

                    Maximum allowed area is 25M pixels (i.e., width × height ≤ 5,000 × 5,000). Exceeding this returns a 400 error.

                    '
                original_image_size:
                  type: array
                  items:
                    type: integer
                  description: 'The desired size of the original image inside the final canvas, as `[width, height]` in pixels.

                    Ensure that the visible part of the input image (foreground or main subject) occupies more than 15% of the total canvas area for optimal results.

                    This field is required when `aspect_ratio` is not provided.

                    Must be used together with `original_image_location`.

                    '
                original_image_location:
                  type: array
                  items:
                    type: integer
                  description: 'The position of the top-left corner of the original image within the final canvas, provided as `[x, y]` in pixels.

                    This defines where the input image will be placed before expansion occurs.

                    The values can be outside the canvas bounds—if so, the image will be cropped accordingly.

                    Required when `aspect_ratio` is not provided.

                    Must be used together with `original_image_size`.

                    '
                prompt:
                  type: string
                  description: 'Optional text prompt to guide the image expansion.

                    If not provided or left empty, a prompt will be automatically generated as part of the service based on the input image.

                    Currently, Bria supports prompts in English only and does not support special characters.

                    '
                prompt_content_moderation:
                  type: boolean
                  default: true
                  description: "When enabled (default: `true`), the input prompt is moderated before processing.\n\n**Expected Behavior**\n- The prompt is scanned for NSFW content and terms that violate Bria’s ethical guidelines.  \n- If the prompt fails moderation, the request is blocked and the API responds with a 422 error.\n"
                seed:
                  type: integer
                  description: You can choose whether you want your generated expension to be random or predictable. You can recreate the same result in the future by using the seed value of a result from the response. You can exclude this parameter if you are not interested in recreating your results. This parameter is optional.
                negative_prompt:
                  type: string
                  description: This parameter is optional. Currently, Bria supports prompts in English only and does not support special characters.
                preserve_alpha:
                  type: boolean
                  default: true
                  description: 'Controls whether the alpha channel values from the input image are retained in the output, if the input includes an alpha channel.

                    - When true: The output image maintains the original transparency of fully and partially transparent pixels.

                    - When false: The output image is fully opaque.

                    - Has no effect if the input image does not include an alpha channel.

                    '
                sync:
                  type: boolean
                  default: false
                  description: "Specifies the response mode.\n  - When `false` (default), the request is processed asynchronously: the API immediately returns a status URL to track progress.\n  - When `true`, the request is processed synchronously: the API hold the connection open until the proccess is complete and then returns the final image URL in the response.\n"
                webhook_url:
                  type: string
                  format: uri
                  description: Optional URL for receiving the result via webhook when the async job completes. See [Webhooks](https://docs.bria.ai/webhooks).
                visual_input_content_moderation:
                  type: boolean
                  default: false
                  description: 'When enabled, applies content moderation to input visual.


                    Expected behavior:

                    - Processing stops if the image fails moderation.

                    - Returns a 422 error with details about which parameter failed.

                    '
                visual_output_content_moderation:
                  type: boolean
                  default: false
                  description: 'When enabled, applies content moderation to result visual.


                    Expected behavior:

                    - If the modified image fails moderation, returns a 422 error.

                    '
            examples:
              Aspect Ratio:
                value:
                  image: https://labs-assets.bria.ai/sandbox-example-inputs/expand_image_example.jpg
                  aspect_ratio: '2:3'
              Precise location, Canvas size in pixels:
                value:
                  image: https://labs-assets.bria.ai/sandbox-example-inputs/expand_image_example.jpg
                  canvas_size:
                  - 1024
                  - 1024
                  original_image_size:
                  - 512
                  - 512
                  original_image_location:
                  - 256
                  - 256
      responses:
        '200':
          description: Successful operation (Synchronous Success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSuccessWithSeedAndPrompt'
        '202':
          description: Accepted (Asynchronous). You can track the progress and retrieve the final result using the Status Service. For more details, refer to the [Status Service](https://docs.bria.ai/status) section.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsyncInitialResponse'
        '400':
