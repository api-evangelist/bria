  /remove_background:
    post:
      summary: Remove Background
      tags:
      - v2 endpoints
      servers:
      - url: https://engine.prod.bria-api.com/v2/image/edit
      description: "[**Try out this capability in Bria's sandbox**](https://platform.bria.ai/image-editing/remove-background)\n\n**Description**\n\n\nThe *Remove BG* Route can be used to remove the background of an image. This route leverages Bria's newest model, RMBG 2.0. For more details and to explore the model, check out the [Hugging Face demo](https://huggingface.co/spaces/briaai/BRIA-RMBG-2.0).\n\n\n**Content Moderation**\n\nThis endpoint includes granular content moderation controls to ensure safe usage across all stages of processing:\n  \n- **Input Image Moderation** – Scans the uploaded image and stops processing if inappropriate or restricted content is detected.\n- **Output Image Moderation** – Evaluates the generated image and blocks the response if it violates safety guidelines.\n\n\n**Constraints**\n\n\nThe Bria API currently supports only JPEG and PNG files in RGB, RGBA, or CMYK color modes. When the file is of a different type or color mode, the status code 415 will be returned.\n\n\n**Transparency and Customizable Binarization**\n\n\nThis endpoint returns an image where the background is removed, and the foreground remains with varying levels of transparency, allowing for smoother edges and more natural blending when placed over different backgrounds. Additionally, this unique output provides developers with the flexibility to binarize the result—transforming it into a binary mask—by setting a custom transparency threshold according to their specific use case. A binary mask is an image where pixels are either fully visible (foreground) or fully transparent (background), commonly used in visual generative AI and image processing pipelines. This capability enables seamless integration into workflows that require clear separation between subject and background, while still offering control over how strict this separation should be.\n\n\nBelow is a simple Python script to demonstrate how you can binarize the output image from the API. This allows you to set your own threshold to determine which areas are considered \"foreground\" and which are \"background.\"\n\n  ```python\n  from PIL import Image\n  import numpy as np\n\n  # Load the image (the output from the API)\n  image = Image.open('output_image.png').convert('RGBA')\n\n  # Convert to numpy array\n  data = np.array(image)\n\n  # Define your threshold (0-255, where 255 is fully opaque)\n  threshold = 128\n\n  # Apply the threshold: if alpha > threshold, set to fully opaque (255), otherwise transparent (0)\n  data[:, :, 3] = np.where(data[:, :, 3] > threshold, 255, 0)\n\n  # Create a new Image from the modified array\n  binarized_image = Image.fromarray(data)\n\n  # Save or display\n  binarized_image.save('binarized_output.png')\n  binarized_image.show()\n    ```"
      operationId: background-remove
      parameters:
      - in: header
        name: api_token
        schema:
          type: string
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - image
              properties:
                image:
                  type: string
                  description: "The image that you would like to remove the background from.\nSupported input types:  \n- **Base64-encoded string**  \n- **URL** pointing to an image file that is publicly accessible and available at the time of processing.  \n\nAccepted formats: **JPEG**, **JPG**, **PNG**, **WEBP**.\n"
                preserve_alpha:
                  type: boolean
                  default: true
                  description: 'Controls whether partially transparent areas from the input image are retained in the output after background removal, if the input includes an alpha channel.

                    - When true: Partially transparent pixels preserve their original alpha values in the output.

                    - When false: All non-background areas in the output are rendered fully opaque.

                    - Has no effect if the input image does not include an alpha channel.

                    '
                sync:
                  type: boolean
                  default: false
                  description: "Specifies the response mode.\n  - When `false` (default), the request is processed asynchronously: the API immediately returns a status URL to track progress.\n  - When `true`, the request is processed synchronously: the API hold the connection open until the proccess is complete and then returns the final image URL in the response.\n"
                webhook_url:
                  type: string
                  format: uri
                  description: Optional URL for receiving the result via webhook when the async job completes. See [Webhooks](https://docs.bria.ai/webhooks).
                visual_input_content_moderation:
                  type: boolean
                  default: false
                  description: 'When enabled, applies content moderation to input visual.


                    Expected behavior:

                    - Processing stops if the image fails moderation.

                    - Returns a 422 error with details about which parameter failed.

                    '
                visual_output_content_moderation:
                  type: boolean
                  default: false
                  description: 'When enabled, applies content moderation to result visual.


                    Expected behavior:

                    - If the modified image fails moderation, returns a 422 error.

                    '
            examples:
              send using url:
                value:
                  image: https://labs-assets.bria.ai/sandbox-example-inputs/remove_background_example.jpg
      responses:
        '200':
          description: Successful operation (Synchronous Success)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSuccessResponse'
        '202':
          description: Accepted (Asynchronous). You can track the progress and retrieve the final result using the Status Service. For more details, refer to the [Status Service](https://docs.bria.ai/status) section.
          content:
