job_states:
  source: https://docs.bria.ai/status
  states:
  - state: IN_PROGRESS
    meaning: Accepted and processing; keep polling.
  - state: COMPLETED
    meaning: Success; result carries image_url, video_url or structured_prompt.
  - state: ERROR
    meaning: Pipeline processing error; stop polling and read the error object.
  - state: UNKNOWN
    meaning: Unexpected internal error, equivalent to HTTP 500 in the async workflow. Contact support with the request_id.
findings:
- >-
  Errors are not RFC 9457 problem+json; there is no type URI and no per-error identifier an agent
  can branch on other than the HTTP status and a free-text message.
- >-
  Two incompatible error shapes ship in the same API: sync error.code is an integer, async/webhook
  error.code is a string.
- >-
  Bria publishes no error-code reference page. Every entry above is derived from the OpenAPI
  response descriptions in this repo, not from a documented registry.
