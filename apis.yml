    url: overlays/bria-image-generation-overlay.yaml
  - type: Documentation
    url: https://docs.bria.ai/image-generation
- aid: bria:image-editing
  name: Bria Image Editing API
  description: Twenty-three v2 image editing operations covering object add/replace/erase
    by text, masked erase and generative fill, background remove/replace/blur, expand,
    enhance, increase resolution, restyle, relight, reseason, colorize, restore and
    text rewrite.
  humanURL: https://docs.bria.ai/image-editing
  baseURL: https://engine.prod.bria-api.com/v2/image/edit
  tags:
