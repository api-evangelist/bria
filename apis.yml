  name: Bria Image Generation API
  description: Text-to-image and structured-prompt (VGL) image generation using Bria's
    FIBO and FIBO Lite models, including generation from a structured JSON prompt and
    generation from a structured-prompt diff.
  humanURL: https://docs.bria.ai/image-generation
  baseURL: https://engine.prod.bria-api.com/v2
  tags:
